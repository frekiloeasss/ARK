message req_msg {    // 空的协议结构体
}

message nonlocal {
  required uint32 platform = 1;
}

message req_bad_guy {
  optional req_bad_guy_report  report   = 1;
}

message req_bad_guy_report {
  required uint64 uid                 = 1;
  required t_report_reason reason_id  = 2;
}

message req_sdk_login { //返回消息可能时错误码
  required t_platform platform    = 1;
  optional string     open_id     = 2;
  required string     token       = 3; //  微信登录时传wx.login返回给客户端的code
  optional uint32     svr_id      = 4; //  如果不传的话，默认取最近登陆一次svr_id, 或者最新服svr_id
  optional bool       is_debug    = 5[default = false]; // true: debug 该字段对wechat登陆无效
  optional nonlocal   nonlocal    = 6;
  optional t_region   t_region    = 7; // 客户端手动选区时候，需要传入该字段
  optional string     lilither_region = 8; // sdk 大会员打点字段
  optional string     lilither_id = 9; // sdk 大会员id
}

// 与客户端讨论过, 客户端不会传undefined, 只会传空字符串
message req_login { //返回消息可能是错误码
  required t_platform platform          = 1;
  required t_os       os                = 2;
  required string     open_id           = 3;
  required uint32     svr_id            = 4;
  required string     htoken            = 5;
  required string     cli_version       = 6; // 客户端版本号,用来跟服务器做比对用
  required int32      time_zone         = 7;
  required t_lang     lang              = 8;
  required string     push_id           = 9;
  required string     idfa              = 10;
  required string     google_aid        = 11;
  required string     android_id        = 12;
  required string     os_version        = 13;
  required string     app_version       = 14;
  required string     device            = 15;
  required string     channel_id        = 16;
  required string     package           = 17;
  optional string     avatar            = 18; // 微信登录时上传头像信息
  optional string     union_id          = 19; // 微信登录时取得的union_id
  optional string     name              = 20; // 微信登录时取得的用户昵称
  optional string     ip                = 21; // 登录时的ip信息
  optional string     line              = 22; // 线路
  optional string     hgame_id          = 23; // 客户端js脚本生成的设备唯一id，重新安装包会重新生成
  optional string     mini_game_type    = 24; // 新手引导小游戏类型
}

message req_reconnect { //没登陆成功不要重连， 返回消息可能是错误码，no_reply表示重连成功
  required t_platform platform    = 1;
  required string     open_id     = 2;
  required uint32     svr_id      = 3;
  required uint64     uid         = 4; //防止未创建的用户使用重连协议
  required string     htoken      = 5;
  optional string     cli_version = 6; // 客户端版本号,用来跟服务器做比对用
  repeated req_md5    md5s        = 7;
  optional string     ip          = 8; // 登录时的ip信息
  optional string     hgame_id    = 9; // 客户端js脚本生成的设备唯一id，重新安装包会重新生成
}
message req_md5 {
  required string type = 1; // Type -> "currency"|"item"|"equip"|"hero"
  required string md5  = 2;
}

message req_bag {
  optional req_msg req_open_bag = 1;
}

message req_unit {
  optional req_up_level                     req_up_level                   = 1;
  optional req_up_quality                   req_up_quality                 = 2;
  optional req_wear_equip                   req_wear_equip                 = 3; // 穿装备
  optional req_rm_equip                     req_rm_equip                   = 4; // 脱装备
  optional uint32                           req_rm_all_equip               = 5; // 卸下所有装备
  optional req_wear_best_equip              req_wear_best_equip            = 6; // 一键穿装备
  optional uint64                           req_lock_hero                  = 7; // 英雄加锁
  optional uint64                           req_unlock_hero                = 8; // 英雄解锁
  optional req_wear_artifact                req_wear_artifact              = 9; // 穿神器
  optional uint32                           req_rm_artifact                = 10;
  repeated req_up_quality                   req_up_quality_one_key         = 11;
  optional req_msg                          req_pentagram_hids             = 12;
  optional req_exchange_equip               req_exchange_equip             = 13;
  optional req_unit_query_hero              req_query_hero                 = 14; // 查询英雄
  repeated uint32                           req_build_balance_trial_heroes = 15; // 构造试用英雄
  optional req_set_assist_hero_id           req_set_assist_hero_id         = 16; // 设置女仆助力英雄
  optional req_totem_up_lv                  req_totem_up_lv                = 17; // 图腾升级
  optional req_totem_batch_up_lv            req_totem_batch_up_lv          = 18; // 图腾批量升级
  optional req_batch_wear_artifact_mitama   req_batch_wear_artifact_mitama = 19; // 给多个英雄穿神器（用于战备界面优化，一键复制神器配置）
  optional req_do_mitama                    req_wear_mitama                = 20; // 穿新神器
  optional req_do_mitama                    req_rm_mitama                  = 21; // 脱新神器
}

message req_batch_wear_artifact_mitama {
  repeated req_wear_artifact        batch_wear_artifact = 1; // 给多个英雄穿神器（用于战备界面优化，一键复制神器配置）
  repeated req_do_mitama            batch_wear_mitama   = 2; // 多个英雄穿脱藏品
}

message req_do_mitama {
  required uint64         hero_id      = 1; //目标穿戴英雄(原神器会自动下掉)
  required uint64         mitama_id    = 2; //穿戴神器id
  optional uint64         from_hero_id = 3; //来自于哪个英雄
}

message req_wear_best_equip {
  required uint64 hero_id        = 1; // 英雄唯一id
  required bool   tag_first_flag = 2; // 玩家选择优先穿带有种族标记的装备
}

message req_totem_up_lv {
  required uint64                 hero_id                = 1;
  required uint32                 node                   = 2; // 节点
  required uint32                 up_lv                  = 3; // 提升等级
}

message req_totem_batch_up_lv {
  required uint64                 hero_id                = 1;
  required uint32                 total_lv               = 2; // 要升到的刻印总等级
}

enum t_maid_src {
  normal              = 1;
  maze_assist         = 2; // 迷宫马车女仆跟随
  maze_team           = 3; // 组队迷宫女仆跟随
  infinite_pve_assist = 4; // 乱时之境pve女仆跟随
}

message req_set_assist_hero_id {
  required uint64                 hero_id                = 1;
  required uint64                 assist_hero_id         = 2;
  required string                 lineup_type            = 3;
  optional t_maid_src             maid_src               = 4;
}

message req_unit_query_hero {
  required uint64                 user_id                = 1;
  required uint64                 hero_id                = 2;
}

message req_up_level{
  required uint64 hero_id  = 1;
  required uint32 up_level = 2;
}

message req_up_quality {
  required uint64         hero_id               = 1;
  repeated uint64         cost_hero_ids         = 2;
}

message req_wear_equip {
  required uint64 hero_id   = 1;
  required uint32 index     = 2;
  required uint32 equip_id  = 3;
}

message req_exchange_equip{
  required uint64 from_hero_id      = 1;
  required uint64 to_hero_id        = 2;
  required uint32 index             = 3;
}

message req_rm_equip {
  required uint64 hero_id   = 1;
  required uint32 index     = 2;
}

message req_wear_artifact {
  required uint64 hero_id      = 1;
  optional uint32 artifact_id  = 2;
  optional uint64 from_hero_id = 3;
}

message req_stage {
  optional req_msg                  query_reward           = 1; // 查询挂机背包
  optional req_msg                  draw_rewards           = 2; // 领取挂机奖励
  optional req_stage_start_battle   start_battle           = 3;
  optional req_end_battle           end_battle             = 4;
  optional req_msg                  quick_idle             = 5; //快速挂机
  optional req_msg                  query_assist_summaries = 6; //查看同一章节的好友和公会玩家信息
  optional req_msg                  next_chapter           = 7; //前往下一章
  optional uint32                   query_records          = 8; //获取战斗录像
  optional req_stage_start_battle   retry_battle           = 9; //重试战斗
  optional uint32                   query_stage_lv_offset  = 10;//查询关卡的等级调整值
  optional req_end_battle           end_battle_fail        = 11;//战斗失败，为写战斗失败oss而加。为方便客户端处理战斗结束逻辑，特与end_battle协议分离。
  optional req_pass_mini_game       pass_mini_game         = 12; // 新手引导小游戏单独结算逻辑
}

message req_stage_start_battle {
  required uint32      stage_id       = 1;
  optional lineup      deprecated_lineup = 2[deprecated=true]; // 已经废弃
  repeated team        teams          = 3;
  required bool        is_real_battle = 4[default = true]; // 正式战斗才能接end_battle
  optional uint32      round_index    = 5;  // retry 时候用, 多队战斗时候第几队战斗
  optional bool        is_auto_battle = 6;  // 是否是自动战斗 true:是自动战斗 false:不是自动战斗
}

message req_pass_mini_game {
  required uint64       stage_id        = 1;
}

