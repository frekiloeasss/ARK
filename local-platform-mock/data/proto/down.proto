}

message reply_recommend_lineups {
  repeated reply_recommend_lineup recommends = 1;
}

message reply_recommend_lineup {
  required uint64                 uid                   = 1;
  required t_stage_record         source                = 2 [default = world]; // 推荐来源
  optional uint64                 point                 = 3; // 积分
  optional uint64                 rank                  = 4; // 排名
  optional bool                   available             = 5; // 是不是可用阵容
  required user_summary           user_summary          = 6; // 玩家简要信息
  repeated hero                   heroes                = 7; // 【详情下发】各个英雄的详情信息(多个队伍英雄会重复，为了减少返回信息的数据大小)
  repeated pet                    pets                  = 8; // 【详情下发】所有宠物
  repeated idle_pvp_battle_his    battle_hiss           = 9; // 【详情下发】当天各个段位各个队伍的胜率信息
  repeated idle_pvp_lineup        lineups               = 10; // 【详情下发】玩家甚至的阵容
  repeated camp_pvp_battle_his    camp_pvp_battle_hiss  = 11; // 【详情下发】当天各个段位各个队伍的胜率信息
  repeated camp_pvp_ban_lineup    camp_pvp_ban_lineups  = 12; // 【详情下发】玩家甚至的阵容
}

