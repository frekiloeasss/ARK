  optional reply_idle_pvp_query_battle_rounds     query_battle_rounds     = 7; // 查询战斗记录
  repeated reply_idle_pvp_battle_record           query_battle_record     = 8; // 查询战斗记录详情
  optional reply_idle_pvp_battle_his              query_battle_his        = 9; // 战报
  optional bytes                                  query_statistics        = 10; // 查询统计信息,压缩后的reply_idle_pvp_statistics
  optional result                                 exit_idle_pvp           = 11; // 退出活动，打点需求
  optional bytes                                  recommend_lineups       = 12; // 阵容推荐简要信息列表,压缩后的reply_recommend_lineups
