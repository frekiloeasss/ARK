// 轻度社交-公会箱子
//============================================================
message reply_act_guild_box {
  optional reply_act_guild_box_open_panel       open_panel        = 1;
  optional reply_act_guild_box_reward           recv_reward       = 2; // 领取个人进度奖励
  optional reply_act_guild_box_give_item        give_item         = 3; // 助力钥匙
  optional reply_act_guild_box_recv_box_reward  recv_box_reward   = 4; // 领取公会宝箱奖励
  repeated reply_act_guild_box_open_invite      open_invite       = 5; // 打开邀请界面
  optional result                               invite            = 6; // 邀请玩家
}

message reply_act_guild_box_open_panel {
  repeated reply_act_guild_box_info   guild_box       = 1;  // 公会宝箱领奖状态
  map<uint64, uint64>                 reward_ts       = 2;  // 个人进度领奖状态 {1, ts}
  repeated item                       act_item        = 3;  // 活动道具
  repeated uint64                     give_uids       = 4;  // 更新贡献了钥匙的公会成员
  repeated user_summary               user_summaries  = 5;
  optional uint64                     change_cnt      = 6;  // 距离上一次获得的活动道具数量
  optional reply_act_guild_box_info   cur_round       = 7;  // 当前公会宝箱轮次信息
}

// 公会箱子领奖信息
message reply_act_guild_box_info {
  required uint64       guild_id  = 1; // 公会ID
  required uint64       round_tid = 2; // 公会宝箱轮次TID
  required uint64       reward_ts = 3[default = 0]; // 公会宝箱领奖时间戳；0表示还未领奖
  repeated uint64       give_uids = 4; // 每一轮宝箱奖励贡献钥匙的玩家
}

message reply_act_guild_box_reward {
  map<uint64, uint64>       recv_ts     = 1; // 领奖状态
  required  reward          reward      = 2; // 奖励
}

message reply_act_guild_box_give_item {
  repeated user_summary               user_summary    = 1;
  repeated reply_act_guild_box_info   reward_info     = 2; // 公会宝箱领奖信息（玩家可以领取的奖励+当天已经领取过的奖励）
  optional reply_act_guild_box_info   cur_round       = 3; // 当前轮次信息
  optional uint64                     show_cnt        = 4; // 用于展示的公会钥匙数量
}

message reply_act_guild_box_recv_box_reward {
  required uint64           guild_id      = 1; // 公会ID
  required uint64           round_tid     = 2; // 宝箱TID
  required uint64           recv_ts       = 3; // 领奖时间戳
  required  reward          reward        = 4; // 奖励
}

message reply_act_guild_box_open_invite {
  required user_summary       user_summary  = 1; //
  optional uint64             item_cnt      = 2; // 活动道具数量
}
