//----------------全局枚举定义, 请不要使用内嵌枚举(JS 限制)----------
// 类型定义, t_开头, t_表示type
// @def enum

enum t_guild_result {
  success        = 1;
  wait_approval  = 2;
  guild_full     = 3;
}

enum t_local_arena_season {
  in_the_season = 1;
  end_season    = 2;
}

enum t_hotness {
  total           = 1;
  stage           = 2;
  arena           = 3;
  tower           = 4;
}

enum t_battle_record_source {
  friend          = 1;
  guild           = 2;
  server          = 3;
  follow          = 4;
  self            = 5;
}

enum t_stage_record{
  friend          = 1;
  guild           = 2;
  world           = 3;
  user            = 4;
  follow          = 5;
  top             = 6; // 排行榜前N名
  top_1           = 7; // 排行榜第1名
  top_2           = 8; // 排行榜第2名
  top_3           = 9; // 排行榜第3名
  other           = 10; // 陌生人
}

enum result {
  success = 1;
  fail    = 2;
}


enum t_gve_item_change {
  add       = 1;
  sub       = 2;
}

enum t_apply_join_view {
  join_success    = 1;
  apply_success   = 2;
}

enum t_join_team_state {
  join_now         = 1; //可直接加入
  need_pass        = 2; //需要小队玩家通过
  applied          = 3; //已申请
  viewer_max       = 4; //观众席位已满
  quited_team      = 5; //已退出不能再次加入
}

enum t_gve_end_reason {
  normal     = 1;  //正常到时间结束
  abandon    = 2;  //弃赛结束
}
// @end
//-------------------------------------------------------------------

