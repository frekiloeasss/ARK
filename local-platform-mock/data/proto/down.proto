message reply_msg {    // 空的协议结构体
}

message reply_err_code {
  required string err_code     = 1;
}

message reply_sdk_login {
  required string     htoken      = 1;      // hgame token
  required uint32     svr_id      = 2;
  optional string     host        = 3;      // 新服务器的IP地址:端口，如果没有表示就是当前连接
  optional string     open_id     = 4;      // 验证微信登录时取得
  optional string     union_id    = 5;      // 微信登录时取得
  optional t_region   redirect    = 6;      // 优先判断是否存在该字段，如果存在直接在登录地址后面拼接上这个串
  optional bool       migrated    = 7[default = false]; // 账号被迁移
  optional bool       is_new_reg  = 8[default = false]; // 是否在经典服没有角色
}

message reply_login {
  optional reply_user            user_info       = 1; // 玩家信息
  required reply_im              im_info         = 2; // 聊天服务器env_id
  required bool                  battle_report   = 3; // 校验失败战斗日志上报
  required int32                 svr_time_zone   = 4; // 服务器时区
  required t_region              region          = 5; // 服务器的性质
  repeated reply_activity_info   activities      = 6; // 活动信息
  repeated reply_challenge_info  challenges      = 7; // 极限挑战时间
  optional string                forum_env_id    = 8; // sdk forum env id
  required bool                  is_new_user     = 9; // 是否是新角色
  optional uint64                create_ts       = 10; // 创建时间
  optional uint64                prohibited_time = 11; //被禁止修改信息的时间
  optional bool                  is_roll_svr     = 12; // 是否为滚服玩家
  optional bytes                 zlib_user_info  = 13; // 压缩后的 user_info
  optional bytes                 d_test          = 14;
}

message d_test {
  repeated d_item items = 1;
}

message d_item {
  required string key     = 1;
  required string data    = 2;
}

message reply_login_slg {
  optional t_slg_phase           phase         = 1;  //slg阶段
  optional uint32                team_id       = 2;  //slg的team_id
  optional t_slg_match_type      match_type    = 3;  //个人或者队伍报名的方式
  optional uint64                map_end_ts    = 4; //slg 地图结束时间
  optional uint64                map_freeze_ts = 5; //slg 地图沉寂时间
  repeated uint64                slg_hero_ids  = 6; //slg 格子里的英雄ids
  optional uint32                slg_season_id = 7; //slg 赛季id
  optional uint32                nobility      = 8; // slg 爵位
  optional uint32                warband_id    = 9; // slg 军团id
  optional uint64                red_pocket_expire_ts = 10; // 红包过期时间
  optional uint32                cur_block_id         = 11; // 如果为undefined则说明从来没进过slgmap
  optional uint64                season_start_ts      = 12; //赛季开始时间
  optional t_slg_identify        identify             = 13; //身份标识
  optional uint64                recent_season_end_ts = 14;
}

message reply_im {
  required   string  env_id       = 4;//for sdk
}

message reply_bag {
  optional reply_open_bag reply_open_bag = 1;
}

message reply_open_bag {
  repeated item  items  = 1;
  repeated equip equips = 2;
}

// 整理顺序
