message reply_curseland_info {
  required uint32                     season_id       = 1;  // 赛季id
  required cd                         challenge_cd    = 2;  // 赛季
  required uint32                     reset_cd_times  = 3;
  required uint64                     end_ts          = 4;  // 赛季结束时间
  optional uint32                     rank            = 5;
  optional uint64                     damage          = 6;
  optional uint32                     count           = 7[deprecated=true];
  repeated rank_board_entry           entries         = 8;
  optional rank_board_next_target     next_target     = 9;  // 下一个目标
  optional uint32                     section_tid     = 10; // 玩家发奖时的tid，对应CurselandRankReward.csv里的Order
  optional uint32                     percent         = 11; // 玩家排名百分比
  repeated uint32                     all_lgd_ids     = 12; // 大区列表
  optional uint32                     self_lgd_id     = 13; // 自己在哪个大区？如果自己没有大区则为undefined
  repeated curseland_bet              bets            = 14; // 竞猜
}

message reply_curseland_challenge {
  required t_battle_result        result              = 1;
  required battle                 battle              = 2;
  required uint64                 old_damage          = 3; // 本次战斗之前的最高伤害
  required uint64                 new_damage          = 4; // 本次战斗之后的最高伤害
  required cd                     challenge_cd        = 5;
  repeated uint64                 damages             = 6; // 伤害列表
}

message reply_curseland_battle_record {
  repeated curseland_battle_record battle_records = 1;
}

message reply_curseland_rank {
  required uint64             season_id       = 1;
  optional uint64             rank            = 2;
  optional uint64             damage          = 3;
  repeated rank_board_entry   entries         = 4;
  optional uint64             count           = 5[deprecated=true];
  optional uint64             section_tid     = 6;  // 玩家发奖时的tid，对应CurselandRankReward.csv里的Order
  repeated curseland_section  sections        = 7;  // 诅咒梦境段位
  optional t_curseland_mod    mod_type        = 8;  // 诅咒梦境模式 rank or dmg
  optional uint64             percent         = 9;  // 玩家排名百分比
  repeated reply_stage_record battle_records_deprecated = 10[deprecated=true]; // 好友、公会成员、关注的人最佳通关记录
  optional uint64             top_num         = 11; // top200总人数，可能不足200，比如182，客户端用来判断分页
  repeated reply_simple_battle simple_battles = 12; // 好友、公会成员、关注的人最佳通关记录, 替代battle_records
}

message reply_curseland_tar_rank {
  required uint64             season_id   = 1;
  optional uint64             rank        = 2;
  optional uint64             damage      = 3;
  repeated rank_board_entry   entries     = 4;
  optional uint64             section_tid = 5;     // 玩家发奖时的tid，对应CurselandRankReward.csv里的Order
}

