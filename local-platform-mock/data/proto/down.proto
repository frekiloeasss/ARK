  optional uint64       block_id     = 6;  // 地块id
  optional uint64       mine_id      = 7;  // 矿唯一id
  optional uint64       record_id    = 8;  // 战斗录像id
  optional uint64       occ_uid      = 9;  // mine_be_occ类型使用
}

message reply_gvg_open_rank {
  required reply_gvg_rank_summary self_summary   = 1;
  repeated reply_gvg_rank_summary rank_summaries = 2;
}

message reply_gvg_rank_summary {
  optional uint64       rank          = 1;
  required uint64       fraction      = 2;
  optional uint64       warband_tid   = 3;
  optional uint64       warband_icon  = 4;
  required user_summary user_summary  = 5;
  required uint64       uid           = 6;
  required uint64       ts            = 7;
  required bool         is_robot      = 8;
  optional uint64       warband_frame = 9;
}

message reply_gvg_warbands_score {
  required uint64            ts           = 1; // 积分时间戳
  repeated reply_gvg_warband gvg_warbands = 2; // 公会数据
}

message reply_gvg_assist {
  optional reply_gvg_open_assist_help_panel  open_panel              = 1; // 打开我向他人求助的列表
  optional reply_gvg_open_assist_apply_panel open_handle_apply_panel = 2; // 打开他人向我求助的列表
  optional result                            apply                   = 3; // 发起互助申请
  optional reply_gvg_open_assist_apply_panel handle_apply            = 4; // 拒绝+拒绝所有互助申请 - 暂不实现
  optional result                            cancel_apply            = 5; // 取消互助申请
  optional reply_gvg_assist_target           change_assist_target    = 6; // 切换互助关系
  optional reply_help_assist_target          help_assist_target      = 7; // 帮助求助我的人打敌人
}

message reply_help_assist_target {
  required reply_gvg_deal_block   reply_help_assist = 1;
}

message reply_gvg_open_assist_apply_panel {
  required uint64                   help_cnt     = 1; // 我的剩余帮助次数
  repeated reply_gvg_assist_apply   applies      = 2; // 我收到的申请求助列表
  map<uint64, uint64>               uid_2_gs_map = 3; // uid2gs映射
}

message reply_gvg_assist_apply {
  required user_summary    user_summary    = 1; // 请求人
  required user_summary    occ_summary     = 2; // 占领人
  required uint64          block_id        = 3; // 地块id 用于跳转
  required uint64          mine_tid        = 4; // 矿tid
}

message reply_gvg_open_assist_help_panel {
  optional reply_assist_open_panel    base_open_panel       = 1; // 通用互助基础信息
  map<uint64, uint64>                 uid_2_gs_map          = 2; // uid2gs映射
  optional reply_gvg_assist_target    reply_assist_target   = 3; // 目标敌人
}

message reply_gvg_assist_target {
  optional reply_gvg_assist_target_result assist_target_result = 1;
}

message reply_gvg_assist_target_result {
  required uint64         tid          = 1; // 矿的tid
  required user_summary   summary      = 2; // 敌人summary
  required uint64         block_id     = 3; // 地块id
}

message gvg_assist_help {
  required user_summary user_summary = 1;
  optional uint64       help_cnt     = 2; // 剩余助人次数
  required uint64       gs           = 3; // 战力
  required bool         applied      = 4; // 已经向其申请过援助
}

message reply_gvg_warband_deal {
  optional reply_gvg_warband           open_warband = 1; // 查看公会界面
  optional reply_gvg_warband_edit_name edit_name    = 2; // 新名字
}

message reply_gvg_warband_edit_name {
  required string name = 1;
  required cost   cost = 2;
}

message reply_gvg_warband {
  required uint64           id                        = 1; // 军团id
  required uint64           tid                       = 2; // 军团tid
  optional uint64           icon                      = 3; // 军团icon
  optional uint64           frame                     = 4; // 军团头像框
  optional string           name                      = 5; // 军团名
  required bool             name_changed              = 6; // 改过名字标志
  repeated reply_gvg_member members                   = 7; // 成员
  required uint64           warband_last_settle_score = 8; // 军团base积分，其实就是members last_settle_score 取一个sum
  required uint64           settle_ts                 = 9; // 军团达成积分的时间戳，用于判断相同积分的两个军团的排序
}

message reply_gvg_member {
  required user_summary        member_summary    = 1; // 成员界面数据
  required uint64              gs                = 2; // 战力
  required uint64              last_settle_score = 3; // 获得的积分
  required uint64              dig_secs          = 4; // 挖矿时间，单位为秒
  required t_warband_title     title             = 5; // 军团身份
  optional uint64              occ_block_id      = 6; // 正在挖的矿的block_id
  optional bool                is_robot          = 7; // 是机器人吗？
}

enum t_gvg_phase {
  signup     = 1; // 报名阶段
  match      = 2; // 匹配阶段
  battle     = 3; // 战斗阶段
  reward     = 4; // 奖励阶段 目前主要用来开宝箱
}

message reply_gvg_phase {
  required  t_gvg_phase type     =  1; // 阶段类型
  required  uint64      start_ts =  2; // 阶段开始时间
  required  uint64      end_ts   =  3; // 阶段结束时间
}

message reply_gvg_open_panel {
  required uint64               season_id             = 1;
  optional reply_gvg_map_open   open_map              = 2;
  optional reply_gvg_phase      phase                 = 3;
  optional bool                 is_signup             = 4; // 是否已经报名
  map<uint64, uint64>           season_id2warband_ids = 5; // 玩家参与过的轮次id和对应的warband_id
  map<uint64, uint64>           chest_items           = 6; // 抽奖道具数量
  optional uint64               limit_ts              = 7; // 最新一期的汇算面板可见时间
  optional uint64               seg_tid               = 8; // 当前玩家所在公会的段位tid
}

message reply_gvg_map_open {
  required uint64                  act                     = 1; // 体力
  repeated uint64                  chat_group_ids          = 2; // map聊天频道id + warband聊天频道id
  required uint64                  map_create_ts           = 3;
  required uint64                  map_end_ts              = 4;
  repeated reply_gvg_block         reply_base_gvg_blocks   = 5;
  repeated reply_gvg_warband       reply_gvg_warbands      = 6;  // 公会数据（无members）
  required uint64                  warband_id              = 7;  // 军团id
  optional uint64                  cur_block_id            = 8;  // 我当前占领的地块id
  optional uint64                  self_last_settle_score  = 9;  // 我个人已结算的积分
  required uint64                  today_use_secs          = 10; // 今日我挖了多久了
  optional gvg_state               last_state              = 11; // 显示战报用的上一次离线状态
  repeated reply_gvg_log           reply_gvg_logs          = 12; // 从上次离线至今的gvg_logs
  optional reply_gvg_assist_target reply_gvg_assist_target = 13; // 当前我的复仇关系
  repeated reply_gvg_plus_summary  players                 = 14;
  repeated gvg_help_assist_teams   help_teams              = 15; // 我对其他玩家的求助预设阵容池
  optional uint64                  target_enemy            = 16; // 军团敌人
  repeated reply_gvg_task          query_tasks             = 17; // 任务界面
  required uint64                  buy_cnt                 = 18; // 已经买了多少次体力
  required bool                    cheating_flag           = 19; // 作弊标志
}

message reply_gvg_plus_summary {
  required user_summary user_summary = 1;
  required uint64       warband_id   = 2;
  required bool         is_robot     = 3;
}

message reply_gvg_map {
  repeated reply_gvg_block             query_blocks           = 1;
  optional reply_create_mines_panel    create_mines_panel     = 2;
  optional uint64                      query_self_def_bank_id = 3;
  repeated reply_bank_id_def_uids_each query_def_pool_uids    = 4;
  optional result                      clear_def_pool_uids    = 5;
  optional result                      join_in_all_def_pool   = 6;
  optional result                      settle_self_block      = 7;
}

message reply_bank_id_def_uids_each {
  required uint64 bank_id  = 1;
  required uint64 team_num = 2;
  repeated uint64 def_uids = 3;
}

message reply_create_mines_panel{
  required uint64 last_cnt     = 1;  // 剩余倒数cnt
  required uint64 join_a       = 2;  // 加入地图人数
  required uint64 query_3      = 3;  // 查看3级矿的人数
  required uint64 battle_3     = 4;  // 在3级矿上消耗的体力数
  required uint64 query_2      = 5;  // 查看2级矿的人数
  required uint64 battle_2     = 6;  // 在2级矿上消耗的体力数
  required uint64 query_1      = 7;  // 查看1级矿的人数
  required uint64 battle_1     = 8;  // 在1级矿上消耗的体力数
  required uint64 self_query_3 = 9;  // 自己查看3级矿的次数
  required uint64 self_query_2 = 10; // 自己查看2级矿的次数
  required uint64 self_query_1 = 11; // 自己查看1级矿的次数
  required uint64 target_3     = 12; // 期望达成的3级矿数量
  required uint64 target_2     = 13; // 期望达成的2级矿数量
  required uint64 target_1     = 14; // 期望达成的1级矿数量
  required uint64 now_3        = 15; // 现在3级矿数量
  required uint64 now_2        = 16; // 现在2级矿数量
  required uint64 now_1        = 17; // 现在1级矿数量
  required uint64 refresh_3    = 18; // 现在3级矿刷新点数量
  required uint64 refresh_2    = 19; // 现在2级矿刷新点数量
  required uint64 refresh_1    = 20; // 现在1级矿刷新点数量
}

message reply_gvg_block {
  required uint64              id               = 1;
  optional reply_gvg_object    reply_gvg_object = 2;
  required uint64              seq              = 3;
}

message reply_gvg_object {
  required uint64           tid            = 1;
  optional uint64           uid            = 2;
  optional uint64           warband_id     = 3;
  required uint64           left_score     = 4;
  optional uint64           last_sync_ts   = 5;
  optional uint64           occ_ts         = 6;
  repeated team_with_hero   def_teams      = 7;
  optional uint64           last_uid       = 8;
  optional uint64           enemy_tid      = 9;
  required uint64           mine_id        = 10;
  optional uint64           def_npc_id     = 11;
  repeated uint64           battle_ts_list = 12;
  optional bool             is_robot       = 13;
  optional bool             last_is_robot  = 14;
  optional uint64           today_use_secs = 15; // 占领该矿的人，今日已经挖了多少秒
  optional uint64           streak_cnt     = 16;
  optional uint64           ban_ts         = 17; // 在ban_ts之前，我不能打该地块（同军团最近被人放弃的地块）
  optional uint64           show_gs        = 18;
}

message reply_gvg_mine {
  optional reply_gvg_deal_block             reply_occ_mine  = 1;
  optional reply_gvg_deal_block             reply_abandon   = 2;
  repeated reply_gvg_object_battle_history  query_histories = 3;
}

message reply_gvg_object_battle_history {
  optional uint64          battle_id  = 1; // 机器人占矿没有battle_id
  required user_summary    summary    = 2;
  required t_battle_result result     = 3;
  required uint64          warband_id = 4;
  required uint64          ts         = 5; // 发生战斗的时间戳
}

message reply_gvg_deal_block {
  optional  reply_gvg_map_change map_change        = 1; // 挑战结束后地块的状态信息
  optional  t_battle_result      result            = 2;
  optional  battle               battle            = 3; // 有数值则表示构造战斗成功，如果构造失败为undefined，失败原因在err_code
  optional  string               err_code          = 4; // 失败的原因
  required  uint64               act               = 5; // 体力
  required  uint64               help_cnt          = 6; // 今日剩余助人次数
  optional  bool                 cancel_apply_flag = 7; // 之前求助过2级矿，自己又占了3级矿，系统取消掉对2级矿的求助
  optional  uint64               today_use_secs    = 8; // 自己打赢or打输发，助人 or 有错（errcode）不发
}

//新神器
message reply_mitama {
  optional reply_mitama_data            open_panel            = 1;
  optional reply_mitama_start           mitama_start          = 2;
  repeated mitama_hero                  init_heroes           = 3; //初始英雄列表
  optional reply_mitama_battle          challenge             = 4;
  optional mitama_hero                  choose_hero           = 5; //选择英雄结果
  optional result                       choose_hex_res        = 6; //选择遗物结果
  optional reply_mitama_reward          recv_reward           = 7;
  optional reply_mitama_confirm         confirm_mitama        = 8; //获得的新神器刷新玩法数据
  optional golem                        up_golem_level        = 9; // 升级魔像结果
  optional reply_mitama_data            next_level_info       = 10; //下一层数据
  optional result                       set_lineup_res        = 11; //设置阵容结果
  optional reply_mitama_buy             reply_mitama_buy      = 12; //购买结果
  optional reply_mitama_end             reply_end_data        = 13; //单局结束时给客户端同步数据
  optional reply_mitama_sell            mitama_sell           = 14; //出售神器
  optional reward                       season_reward         = 15; //赛季奖励
  optional reply_golem                  reply_golem           = 16; //魔像相关
  optional reply_do_affix               do_affix              = 17; //词缀事件结果
  optional reply_open_gift_panel        open_gift_panel       = 18; //打开特权礼包面板
  optional mitama_event                 event                 = 19; //事件详情
  optional reply_quick_explore          quick_explore         = 20; //快速探索返回
  optional reply_use_custom_affix       use_custom_affix      = 21; //使用定制卡定制的结果
  optional cost                         use_ticket_cost       = 22; //消耗
  optional reply_sell_unformed_mitama   sell_unformed_mitama  = 23; //售卖未成型的神器
  optional reply_forg_mitama            forg_mitama           = 24; //锻造神器
  optional reply_revert_mitama          revert_mitama         = 25; //还原神器
  optional reply_exchange_mitama        exchange_mitama       = 26; //交换藏品
  optional reply_exchange_mitama        unwear_mitama         = 27; //脱掉藏品穿戴着的英雄
  optional reward                       recv_weekly_reward    = 28; //领取每周探索补给
}

message reply_exchange_mitama {
  repeated hero                   heroes       = 1;
  repeated mitama_unit            mitama_units = 2;
}

message reply_mitama_sell {
  required reward            reward = 1;
  required cost              cost   = 2;
  repeated hero              heroes = 3; //售卖导致英雄被脱下藏品
}

message reply_revert_mitama {
  required mitama_unit           mitama_unit       = 1;
  optional reward                reward            = 2; //还原神器返还的材料
  repeated hero                  new_heroes        = 3; //穿戴这个神器的英雄战力需要刷新
}

message reply_forg_mitama {
  required mitama_unit           mitama_unit       = 1;
  required cost                  cost              = 2;
  repeated hero                  new_heroes        = 3; //穿戴这个神器的英雄战力需要刷新
}

message reply_sell_unformed_mitama {
  required reward              sell_reward      = 1;
  required reply_mitama_data   mitama_data      = 2;
}

message reply_use_custom_affix {
  required affix             affix          = 1;
  required cost              cost           = 2;
  required uint64            use_custom_cnt = 3;
}

message reply_quick_explore {
  repeated golem_effect      golem_effects        = 1; // 触发的所有魔像效果
  required uint64            cur_level            = 2; // 当前层数
  repeated mitama_event      events               = 3; // 本层事件列表
  optional mitama_unit       cur_mitama           = 4; // 本局神器状态
  optional uint64            cur_event_order      = 5; // 当前事件Order
  repeated affix             affixs               = 6; // 当前词缀列表
  optional bool              game_end             = 7; // 是否已经结束
}

message reply_mitama_battle {
  required t_battle_result result                         = 1; // 战斗结果
  required battle          battle                         = 2; // 战斗信息
  required uint64          order                          = 3; // 战斗后事件id
  required uint64          defeated_value                 = 4; // 失败值
  required mitama_unit     mitama_unit                    = 5; // 战斗后神器等级以及经验可能变化
  optional golem_effect    golem_effect                   = 6; // 触发了魔像效果
  required uint64          beat_boss_cnt                  = 7; //单局击败首领数量
  required uint64          beat_enemy_cnt                 = 8; //单局击败敌人数量
}

message reply_mitama_end {
  optional golem_effect           golem_effect       = 1; //当局结束触发魔像
  repeated affix                  buff_affixs        = 2; //buff等级生效所获得的词缀
}

message reply_mitama_buy {
  required hero           hero    = 1;
  required cost           cost    = 2;
}

message reply_mitama_confirm {
  required reward                   new_mitama            = 1; //获得的新神器
  required reply_mitama_data        new_mitama_data       = 2; //重置玩法数据
}

message reply_mitama_reward {
  optional reward                  reward                = 1; //领取了游戏内奖励资源
  repeated mitama_hero             heroes                = 2; //领取了hero_box事件的英雄(增量
  repeated affix                   affixs                = 3; //领取了词缀事件(增量
  optional uint64                  defeated_value        = 4; //触发陷阱或者奖励将使得眼睛大小发生了变化(全量
}

message reply_mitama_start {
  required reply_mitama_data          mitama_data           = 1;
  optional reward                     reward                = 2; // 消耗金色魔像累计会获得定制词缀卡的奖励
  optional uint64                     custom_progress       = 3;
  optional uint64                     cost_golden_golem_num = 4;
  optional cost                       cost                  = 5; // 开始玩法时扣除的魔像资源
  map<uint64, uint64>                 mitama_to_cost_golem  = 6; //每种藏品消耗了多少金色魔像
}

message reply_mitama_data {
  required uint64            season_id            = 1; // 玩家正在完的赛季id
  repeated uint64            hex_tids             = 2; // 获得的羁绊列表
  repeated affix             affixs               = 3; // 获得的词缀列表
  repeated uint64            golems               = 4; // 本局所选的魔像列表
  required uint64            challenge_cd         = 5; // 已经使用的// 挑战次数（每周刷新)
  required uint64            cur_level            = 6; // 当前层数
  required uint64            defeated_value       = 7; // 失败值，到达上限后当局结束
  repeated mitama_hero       heroes               = 8; // 玩法内拥有的英雄信息
  repeated mitama_event      events               = 9; // 本层事件列表
  optional mitama_unit       cur_mitama           = 10; // 本局获得的神器
  required uint64            cur_event_order      = 11; // 当前事件进行到了哪个
  optional uint64            cur_season_id        = 12; // 自然时间的season_id，客户端判断了赛季过期弹出提示框让玩家确认神器结束
  required uint64            his_max_level        = 13; // 历史最高层数(客户端和当前层数对比，用较大的层数显示任务完成状态)
  optional uint64            season_end_ts        = 15; // 自然时间的赛季结束时间
  optional uint64            next_refresh_ts      = 16; // 下次挑战次数刷新/心愿单生效次数刷新时间
  optional golem_effect      golem_effect         = 19; // 进入下一层时触发了魔像效果
  optional bool              game_end             = 20; // 为true是游戏已经结束
  optional uint64            max_challenge_cnt    = 21; // 最大挑战次数
  optional bool              is_quick_explore     = 22; // 是否是快速探索
  optional uint64            use_custom_cnt       = 23; // 使用定制卡的次数
  optional uint64            weekly_reward_ts     = 28; //每周补给领奖时间戳
}

message reply_act_endless_draw {
  optional reply_endless_draw_open_panel  open_panel  = 1;
  optional endless_draw_result            draw        = 2;
  optional endless_draw_result            save        = 3;
  optional reward                         reward      = 4;
}

message reply_endless_draw_open_panel {
  optional endless_draw_result save_result = 1; // 保存的抽卡结果
  optional uint64              reward_id   = 2; // 领取结果id
  optional endless_draw_result last_draw   = 3; // 最后一次的抽卡结果，保存了置空
}

