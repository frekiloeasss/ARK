  repeated reply_idle_pvp_battle_rounds battle_rounds      = 1; // 战斗记录
}

message reply_idle_pvp_battle_rounds {
  required uint64                     round           = 1; // 第几轮战斗
  required uint64                     before_score    = 2; // 本轮战斗结束前的积分
  optional uint64                     after_score     = 3; // 本轮战斗结束后的积分
}

// 查询具体某轮战斗的战斗记录
message reply_idle_pvp_battle_record {
  required uint64         team_id = 1;
  required battle_record  record  = 2;
  optional idle_pvp_battle_record record_detail = 3;
}
// 战报
message reply_idle_pvp_battle_his {
  repeated idle_pvp_battle_his    reports         = 1;
  optional idle_pvp               region_info     = 2; // 当前赛区信息
}

// 数据大厅
message reply_idle_pvp_statistics {
  repeated idle_pvp_statistics statistics = 1;
}

// 与上一次排名变化
message reply_idle_pvp_rank_change {
  optional idle_pvp_ranking_info      last_ranking        = 1; // 上次的排名信息
  required idle_pvp_ranking_info      current_ranking     = 2; // 当前的排名信息
}

// 毕业确认
message reply_idle_pvp_newbie_up {
  required uint64                     region_id           = 1; // 毕业会导致玩家所在赛区id变化
  optional idle_pvp_newbie            newbie              = 2; // 新手赛区信息
}

