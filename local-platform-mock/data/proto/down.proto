  optional uint64           rank          = 1; // 排名
  optional uint64           bt_cnt        = 2; // 今日战斗总次数
  optional uint64           win_cnt       = 3; // 今日胜利总次数
  optional uint64           rank_cnt      = 4; // 总人数
  optional uint64           start_ts      = 5; // 当前赛季或下赛季开启时间
  optional uint64           end_ts        = 6; // 当前赛季或下赛季结束时间
  optional uint64           season        = 7; // 当前赛季或下赛季id
  optional idle_pvp_newbie  newbie        = 8;
  optional bool             show_general  = 9; // 是否显示大将军标签(如果下一赛季开阵营赛的话就显示)
}

// 打开面板
message reply_idle_pvp_open_panel {
  required uint64                     season_id           = 1; // 赛季id
  required uint64                     region_id           = 2; // 玩家所在赛区id
  optional uint64                     route_id            = 3; // 玩家所在路线
  required uint64                     last_region_id      = 4; // 最后一个赛区id，赛区id从1开始
  repeated asset                      daily_rewards       = 5; // 每日奖励
  optional idle_pvp_ranking_info      last_ranking        = 6; // 上次的排名信息
  required idle_pvp_ranking_info      current_ranking     = 7; // 当前的排名信息
  repeated idle_pvp_lineup            preset_lineup       = 8; // 预设阵容，<段位, 阵容>
  repeated idle_pvp_lineup            locked_lineup       = 9; // 今日阵容，<段位, 阵容>
  optional uint64                     sign_up_ts          = 10; // 报名时间
  optional idle_pvp_newbie            newbie              = 11; // 新手赛区信息
}

// 查询排行榜
message reply_idle_pvp_query_rank {
  repeated rank_board_entry    others     = 1; // 其他玩家的信息(如果玩家自己也在前n名, 这里也包括)
  optional rank_board_entry    self       = 2; // 玩家自己的信息
  required uint64              player_num = 3[default = 0]; // 排行榜总人数
}

// 查询战斗记录
