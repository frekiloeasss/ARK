}

// banner展示信息
message camp_pvp_banner {
  optional uint64           camp_id       = 1; // 阵营id
  optional uint64           season_id     = 2; // 赛季id
  optional t_camp_title     title         = 3; // 普通玩家 or 大将军
  optional uint64           start_ts      = 4; // 当前赛季或下赛季开启时间
  optional uint64           end_ts        = 5; // 当前赛季或下赛季结束时间
  optional uint64           act_point     = 6[default = 0]; // 用于计算军衔
}

// 打开面板: 返回各阵营积分
message reply_camp_pvp_open_panel {
  required uint64                     season_id   = 1; // 赛季id
  required uint64                     camp_id     = 2; // 当前阵营信息
  repeated camp_pvp_score_panel       camp_panels = 3; // 各阵营信息
}

// 阵营积分面板
message camp_pvp_score_panel {
  required uint64             id            = 1;
  required uint64             total_score   = 2; // 阵营总积分
  repeated rank_board_entry   entries       = 3; // top50 | top3
  repeated camp_score_entry   score_entries = 4; // 各大将军的积分贡献
}

// 打开自己阵营面板
message reply_camp_pvp_open_camp {
  required camp               camp          = 1; // 当前阵营信息
  required reply_ucamp_pvp    ucamp_pvp     = 2;
  optional uint64             round         = 3; // 当前打到第几轮
  optional uint64             chat_group_id = 4;
}

// 阵营数据
message camp {
  required uint64           id                  = 1; // 阵营id
  required uint64           season_id           = 2;
  repeated camp_pvp_log     logs                = 3; // 日志
  optional uint64           total_win           = 4; // 所有大将军胜利次数总和，用于判断是否触发阵营红包
  repeated uint64           general_uids        = 5; // 大将军列表, uid列表
  required uint64           soldier_amount      = 6; // 普通成员数量，自增数字
  repeated camp_buff_score  votes               = 7; // 种植buff投票 不同类型 自增、自减数字
  repeated camp_buff_score  buff_scores         = 8; // 已获取的各buff积分 不同类型 自增数字
  repeated camp_buff_score  locked_buff_scores  = 9; // 已锁定已获取的各buff积分 不同类型 自增数字
  repeated camp_buff_score  act_chooses         = 10; // 各种行动的玩家人数分布 不同类型 自增、自减数字
  repeated camp_buff_score  locked_act_chooses  = 11; // 已锁定的各种行动的玩家人数分布 不同类型 自增、自减数字
  repeated camp_treasure    treasures           = 12; // 已触发的阵营红包(CampPvpRandom.csv的tid列表)
}

message reply_ucamp_pvp {
  required uint64                         season_id         = 1;
  required t_camp_title                   title             = 2; // 普通玩家 or 大将军
  optional camp_pvp_lineup                farm_lineup       = 3; // 种植阵容
  optional camp_pvp_lineup                scout_lineup      = 4; // 侦察阵容
  optional camp_pvp_lineup                fight_lineup      = 5; // 争夺阵容
  optional camp_pvp_lineup                general_lineup    = 6; // 大将军阵容
  repeated uint64                         bets              = 7; // 竞猜[征税]
  repeated uint64                         treasures         = 8; // 已领取的阵营红包【福利】
  repeated camp_buff_score                buff_scores       = 9; // 为阵营获取的各个buff积分，用于计算
  optional camp_pvp_act_signup            act_signup        = 10; // 行动报名(下两场希望参与的行动)
  optional act_task                       act_task          = 11; // 任务模块，用 act_task \ act_chest 来实现
  optional uint64                         total_win         = 12; // 总胜利场次
  optional uint64                         score             = 13; // 大将军 elo分数
  optional uint64                         rank              = 14; // 大将军当前排名
  optional camp_pvp_act_signup            locked_act_signup = 15; // 当前行动报名
  repeated camp_pvp_soldier_stat          stats             = 16; // 整个赛季各个行动的战斗次数&胜利次数
  optional uint64                         his_max_score     = 17; // 本赛季最高分数
}

