message act_pumpkin {
  repeated pumpkin_order           orders                    = 1; // 委托完成情况
  optional uint64                  draw_cnt                  = 2[default=0]; // 抽取南瓜组件的次数
  repeated uint64                  item_ids                  = 3;  // 已获取的南瓜组件id列表(不可重复获得)
  repeated uint64                  day_praise_uids           = 4;  // 每日已点赞的uid列表
  repeated pumpkin_my_diy          diy_his                   = 5;  // diy历史作品
  optional pumpkin_my_diy          medal                     = 6;  // 选作贴纸的diy作品
  optional pumpkin_hero            main_hero                 = 7;  // 活动主英雄的养成信息
  optional pumpkin_map             cur_map                   = 8;  // 当前战斗地图信息
  optional uint64                  pass_stage_count          = 9[default = 0];  // 所有通关关卡累计数量
  repeated uint64                  stage_count_recvd_rewards = 10; // 已经领取的累计通关关卡奖励列表
  repeated uint64                  memory_chip_rewards       = 11; // 已经领取的记忆碎片奖励列表
  repeated uint64                  area_memory               = 12; // 记录进入新区域领取的奖励
}

message pumpkin_order {
  required uint32            id           = 1; //委托id
  repeated uint32            submit_ids   = 2; //玩家提交的南瓜组件id
  optional uint32            star         = 3;
}

message pumpkin_my_diy {
  required uint64       id    = 1;
  repeated pumpkin_part parts = 2;
}

// 这个结构会被medal系统存储，所以要保持兼容性
message pumpkin_diy {
  repeated pumpkin_part parts = 1;
}

message pumpkin_part {
  required uint64 id       = 1;
  optional uint64 pos_x    = 2; // x坐标
  optional uint64 pos_y    = 3; // y坐标
  optional uint64 rotation = 4; // 旋转 0 ~ 360
  optional bool   mirror   = 5; // 镜像翻转
  optional uint64 scale    = 6; // 伸缩(按照百分比表示)
}

message pumpkin_hero {
  required uint64 tid       = 1; // 主英雄tid
  required uint64 growth_id = 2; // 养成能力成长id
}

message pumpkin_map {
  required  uint64       id           = 1;
  required  pumpkin_area cur_area     = 2; // 只记录当前进行区域
}

message pumpkin_area {
  required  uint64        id                  = 1;
  repeated  pumpkin_stage stages              = 2;
}

message pumpkin_stage {
  required uint64 id                    = 1;
  repeated uint64 self_hero_tids        = 2; // 己方除主英雄之外的可选英雄列表
  optional uint64 battle_id             = 3; // 敌方 battle id
  optional uint64 reward_ts             = 4; // 战斗关卡可以用来判断是否通关，事件关卡用来判断是否领奖
  optional uint64 normal_challenge_cnt  = 5[default = 0]; // 关卡不触发难度升级时玩家挑战该关卡的次数
  optional uint64 challenge_cnt         = 6[default = 0]; // 关卡挑战次数
}

message act_fish {
  required uint64           act_id              = 1;      // 活动id
  optional fish             rand_fish           = 2;      // 要钓上来的鱼
  repeated fish_album       fish_albums         = 3;      // 鱼的图鉴列表
  required uint64           last_reset_ts       = 4;      // 上次刷新的时间,可以无数次钓鱼 但 每天只能钓上来6条鱼
  required uint64           fish_sum            = 5;      // 总共钓了几条鱼
  repeated item             act_items           = 6;      // 活动中的鱼，鱼饵信息
  required common_assist    common_assist       = 7;      // 互助系统公用的结构
  required uint64           today_recv_cnt      = 8;      // 今日已经收了几条鱼
  repeated uint64           today_helped_uids   = 9;      // 今天已经帮助了哪些人
}

