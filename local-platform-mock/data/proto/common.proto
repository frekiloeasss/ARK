// 周期性的充值抽奖
// 前期会做成由活动控制 因此is_act为true 后续会切换为常驻功能 is_act为false
message charge_roll {
  required uint64             reward_ver               = 1 [default = 0]; // 奖池版本 每次大周期刷新奖池时更新到最新 周期内各种操作都以此版本为准
  repeated uint64             recvd_orders_deprecated  = 2 [deprecated = true]; // 已领取的格子列表 因为可选组可以在抽奖期间更换因此这里记录的实际上是格子的顺序id
  required uint64             selected_id              = 3 [default = 0]; // 当前选择的可选组id 0表示未选择
  required uint64             cur_count                = 4 [default = 0]; // 当前小周期获得的抽奖次数 跨小周期重置
  required uint64             total_count              = 5 [default = 0]; // 当前大周期内获得的所有可抽取次数总和
  required uint64             drawed_count             = 6 [default = 0]; // 当前大周期已抽取的次数
  required uint64             charge_point             = 7 [default = 0]; // 当前小周期内积累的充值点数(跨小周期时清空)
  required uint64             round                    = 8 [default = 0]; // 当前小周期id
  required uint64             timestamp                = 9 [default = 0]; // 大周期发生变化时的时间戳(常驻模式使用)
  required uint64             big_round                = 10 [default = 0]; // 大周期id 当前配置:1大周期= 15小周期 跨越大周期时会自动消耗所有抽奖次数
  optional uint64             act_id                   = 11 [default = 0]; // 改为存储season_id
  repeated uint64             goods_ids                = 12; // 每次小周期刷新时生成新的可购买礼包
  required uint64             refresh_reward_cnt       = 13 [default = 0]; // 重置奖池次数 日志用
  optional bool               is_final_auto_draw       = 14 [default = true]; //结算自动抽奖
  repeated uint64kv           recvd_slots              = 15; //领取过的格子奖励<格子id,主题id>
}


// ==================== 公会养宠物 ====================
// 公会养宠物：体力、奖励领取情况
message act_guild_zoo {
  required act_guild_zoo_point    point               = 1; // 体力
  required uint64                 his_consume_point   = 2[default=0]; // 历史总消耗体力
  repeated uint64                 recvd_points        = 3; // 已领取的体力奖励, ActGuildZooStaminaReward.csv
  repeated uint64                 recvd_progress      = 4; // 已领取的宠物进度奖励, ActGuildZooGuildProgressReward.csv
  repeated uint64                 recvd_pets          = 5; // 已领取的宠物解锁奖励
  repeated uint64kv               votes               = 6; // 已投票的宠物,每个宠物每天可投一次，每次投票判断需过滤已跨天的投票 key pet_id value ts
  required uint64                 invalid_point       = 7[default=0]; // 退公会被清的体力，不能购买的体力
  repeated uint64                 gift_goods_ids      = 8; // 已解锁的礼包 chargeGoods id 列表
}

message act_guild_zoo_pet {
  required uint64     id              = 1;
  required bool       unlock          = 2; // 是否解锁
  required uint64     progress        = 3[default = 0]; // 当前进度
  required uint64     vote_cnt        = 4[default = 0]; // 投票数
  required uint64     last_day_score  = 5[default = 0]; // 昨日积分增加值
  required uint64     today_score     = 6[default = 0]; // 今日积分增加值(当天的积分收入需要第二天才加入排行榜)
  required bool       broke           = 7[default = false]; // 当前分段是否已突破
}

message act_guild_zoo_log {
  required uint64     tid      = 1;  // 日志表格id, ActGuildZooLog.csv
  required uint64     ts       = 2;  // 创建时间
  required uint64     uid      = 3;  // 日志产生者
  repeated uint64     params   = 4;  // int list参数,
}

message act_guild_zoo_point {
  required uint64        cur_point        = 1[default = 0]; // 当前可用
  required uint64        last_restore_ts  = 2[default = 0]; // 上次恢复时间
}

message act_guild_zoo_battle_record {
  required uint64 uid         = 1;
  required uint64 damage      = 2;
  required uint64 battle_id   = 3;
  required uint64 ts          = 4;
}

message act_guild_zoo_daily {
  required uint64 last_restore_ts     = 1; // 重置时间，跨天重置
  required uint64 score               = 2[default = 0]; // 累计积分
  required uint64 point               = 3[default = 0]; // 累计消耗体力
  required uint64 last_point          = 4[default = 0]; // 昨日公会体力总消耗
  required uint64 today_point         = 5[default = 0]; // 今日公会体力总消耗
}

message pet_pentagram {
  required uint64 pg_lv             = 1[default = 0]; //共鸣等级
  repeated uint64 pet_ids           = 2; //共鸣过的宠物id
  repeated uint64 last_cond_ids     = 3; //共鸣时的条件宠物id
}

// 支线关卡之无尽关卡
message side_endless {
  required uint64                 his_max_floor   = 1[default = 0]; // 历史最高层数
  required uint64                 last_floor      = 2[default = 0]; // 上一次打的层数
  optional cd                     challenge_cd    = 3; // 挑战次数限制
  required cd                     buy_cd          = 4; // 购买次数
  optional uint64                 battle_id       = 5; // 最高记录时的战斗录像id
  optional side_endless_ranking   last_ranking    = 6; // 上次查询排行榜相关信息
}

message side_endless_ranking {
  required uint64 ts              = 1[default = 0]; // 上次查询的时间
  required uint64 ranking         = 2[default = 0]; // 上次查询时的排名
  required uint64 player_num      = 3[default = 0]; // 上次查询时总参赛人数
}

enum t_race_score {
  damage      = 1;  //伤害成绩直接展示
  kill_score  = 2;  //击杀数量等多维度成绩需要按照约定规则拆分显示
}

message race_dream_score {
  required uint64             score       = 1;
  required t_race_score       score_type  = 2;
}

// 竞速梦境自动挑战
message race_dream_auto_challenge {
  required uint64            max_cnt      = 1; // 要打多少次
  required uint64            cur_cnt      = 2[default = 0]; // 已经打了多少次
  required uint64            create_ts    = 3; // 开始自动挑战的时间戳
  required cost              cost         = 4; // 总计消耗资源
  optional race_dream_score  max_score    = 5; // 本次自动挑战最好成绩
  optional t_quit_reason     reason       = 6; // 停止原因
  required bool              new_score    = 7[default = false]; // 是否创下新记录
}

message race_dream_battle_record {
  required uint64              replay_id = 1;
  required race_dream_score    score     = 2;
  required uint64              create_ts = 3;
}

// 梦境任务
message dream_task {
  required uint64            task_id           = 1;
  required uint64            target_progress   = 2 [default = 0];
  optional uint64            last_reward_time  = 3;
  optional uint64            start_ts          = 4; //任务开启时间
}


//============================================================
// auto_bt
//============================================================
// 当前战斗阶段
enum t_auto_bt_phase {
  auto_bt_phase_init         = 1; // 初始化：处理报名
  auto_bt_phase_init_over    = 2; // 初始化结束
  auto_bt_phase_match        = 3; // 正在匹配
  auto_bt_phase_match_over   = 4; // 匹配结束，开始开始战斗
  auto_bt_phase_battle       = 5; // 战斗阶段
  auto_bt_phase_battle_over  = 6; // 本轮战斗结束。可进行下一轮匹配或者结束今日匹配和战斗
  auto_bt_phase_over         = 7; // 当日所有轮次已打完
  auto_bt_phase_half_over    = 8; // 半场结束
  auto_bt_phase_half_init    = 9; // 半场初始化结束
}

//============================================================
// 阵营赛
//============================================================
// 玩家类型
enum t_camp_title {
  soldier = 1; // 普通玩家
  general = 2; // 大将军
}
// 普通玩家行动类型
enum t_camp_pvp_act_type {
  general = 1; // 大将军
  farm    = 2; // 种植
  scout   = 3; // 侦察
  fight   = 4; // 争夺
}

// 随机奖励事件
enum t_camp_pvp_event {
  bet       = 1; // 竞猜[征税]
  treasure  = 2; // 阵营红包
}
// 查看排行榜：榜单类型
enum t_camp_pvp_rb_type {
  total = 1; // 总榜
  camp  = 2; // 指定阵营榜单
}
// 发奖类型
enum t_camp_pvp_send_type {
  show_day = 1; // 展示期第一天发奖
  end_day  = 2; // 活动结束发奖
}

// 积分面板信息中各大将军排名、积分、额外积分信息
message camp_score_entry {
  required uint64 uid         = 1;
  required uint64 rank        = 2;
  required uint64 score       = 3;
  required uint64 time        = 4;
  required uint64 extra_score = 5; // 排名额外积分
}

message camp_treasure {
  required uint64           tid = 1;
  required uint64           uid = 2;
  repeated camp_score_entry tops = 3; // 当时排名top3
}

// 各buff数据: 投票 | 已获得积分 | 行动报名人数
message camp_buff_score {
  required t_camp_pvp_act_type  act_type  = 1;
  optional uint64               id        = 2; // buff_type=scout时，表示针对哪个阵营的buff
  optional uint64               score     = 3 [default = 0]; // 已获得的积分 | 人数 | 票数
  optional uint64               task_pct  = 4 [default = 0]; // 额外加成(普通玩家出征选项和大将军推荐的一样的话，有额外的积分加成)
}

message camp_pvp_log {
  required uint32   tid      = 1;  // 日志表格id
  required uint32   ts       = 2;  // 创建时间
  optional uint64   uid      = 3;  // 日志产生者
  repeated uint64   params   = 4;  // int list参数,
}

message camp_pvp_lineup {
  repeated camp_pvp_ban_lineup lineups = 1; // 阵容
}

message camp_pvp_ban_lineup {
  required lineup lineup       = 1; // 阵容
  optional uint64 ban_hero_tid = 2; // 大将军可以设置不匹配的英雄（目前只能设置一个）
}

message camp_pvp_battle_record {
  required uint64             team_id             = 1; // 队伍id
  required bool               is_self             = 2;
  optional uint64             oppo_uid            = 3; // 敌方uid
  repeated uint64             oppo_hero_ids       = 4; // 敌方阵容
  repeated uint64             self_hero_ids       = 5; // 自己的阵容
  optional battle_output      output              = 6; // 临时存下战斗结果，只存血量信息
  optional t_battle_result    battle_result       = 7; // 临时存下战斗结果
  required uint64             rand_seed           = 8;
  optional int64              self_score_add      = 9; // 自己的分数变化
  optional int64              oppo_score_add      = 10; // 敌方的分数变化
  optional int64              oppo_before_score   = 11; // 敌方初始分数
  optional uint64             oppo_team_id        = 12; // 敌方队伍id
  optional uint64             oppo_camp_id        = 13; // 敌方所属阵营
  optional bool               is_bot              = 14 [default = false]; // 是不是配表的机器人
}

message camp_pvp_battle_his {
  required uint64                     id            = 1; // days * 10000 + camp_id * 1000 + actionID * 100 + team_id. camp_id:敌方阵营，用于计算不同阵营胜率
  required uint64                     day           = 2; // 活动第几天
  repeated uint64                     hero_ids      = 3; // 上阵的英雄id
  required uint64                     bt_cnt        = 4[default = 0]; // 战斗场数
  required uint64                     win_cnt       = 5[default = 0]; // 胜利场数
  repeated camp_pvp_report_lineup     win_lineups   = 6; // 战胜过的敌人阵容
  repeated camp_pvp_report_lineup     lost_lineups  = 7; // 输过的敌人阵容
  repeated uint64                     pet_ids       = 8; // 宠物ids
}

// 上阵了哪些英雄
message camp_pvp_report_lineup {
  repeated uint64 hero_tids = 1;
}

// 行动报名
message camp_pvp_act_signup {
  required t_camp_pvp_act_type  act_type      = 1; // 报名参与的行动
  required uint64               id            = 2; // buff_type=scout时，表示针对哪个阵营的buff; buff_type=farm时，表示具体的buff_id
  optional uint64               signup_ts     = 3; // 报名过期时间
  optional bool                 had_task_pct  = 4 [default = false]; // 是否有任务加成
}

// 普通玩家统计信息：整个赛季各个行动战斗次数&胜利次数
message camp_pvp_soldier_stat {
  required uint32   action_id = 1;
  optional uint64   bt_cnt    = 2 [default = 0];
  optional uint64   win_cnt   = 3 [default = 0];
}

// 阵容分析推荐的玩法
enum t_recomm_type {
  curseland = 1; // 诅咒梦境
}

message collect_battle_ids {
  required t_recomm_type type                   = 1;
  repeated simple_battle collect_simple_battles = 2;
}

message simple_battle {
  required uint64 uid       = 1;
  required uint64 record_id = 2;
  required uint64 score     = 3;
}

message act_bingo {
  repeated act_bingo_panel panels             = 1; // 抽奖面板,有三个不同size的宾果机
  optional uint64          choose_draw_cnts   = 2 [default = 0]; // 花费钻石指定格子抽奖次数,暂定上限一次
}

message act_bingo_panel {
  required uint64          panel_id             = 1;
  required uint64          pool_id              = 2; // 奖池ID
  repeated uint64          opened_blocks        = 3; // 已打开的格子
  repeated uint64          opened_cross_blocks  = 4; // 已打开的连通格子
}
//============================================================
// 地下城探险
//============================================================
enum t_act_dnf_attr {
  sig       = 1;
  furniture = 2;
  totem     = 3;
}

message act_dnf {
  repeated act_dnf_stage    stages      = 1; // 关卡
  required uint64           cur_hero_id = 2[default = 1]; // 自增英雌id
  repeated act_dnf_hero     heroes      = 3; // 英雄，只保存系统送的
  repeated act_dnf_rune     runes       = 4; // 符文: 所有英雄共享
  required uint64           reward_ts   = 5[default = 0]; // 最后领取宝箱时间
  required uint64           grid_cnt    = 6; // 总格子数量
  repeated act_dnf_record   records     = 7;
}

message act_dnf_record {
  optional uint64 battle_id = 1;
  optional uint64 damage    = 2;
}

message act_dnf_stage {
  required uint64 stage_tid         = 1;
  optional uint64 first_passed_ts   = 2; // 首次通关时间
  optional uint64 max_damage        = 3[default = 0]; // boss
  optional uint64 battle_id         = 4;
}

message act_dnf_hero {
  required uint64         hero_id   = 1; // 英雄id，从1开始，玩家自己的英雄id是从 1000 开始的
  optional hero           hero      = 2;
  repeated act_dnf_attr   attrs     = 3; // 刻印、家具、专属等养成
  required bool           is_employ = 4[default = false]; // 是不是系统送的佣兵
  optional uint64         original_hero_id    = 5; // 原始英雄id
  optional uint64         original_linked_hid = 6; // 原始链接的英雄id
}

message act_dnf_attr {
  required t_act_dnf_attr attr  = 1;
  required uint64         level = 2; // 等级
}

message act_dnf_rune {
  required uint64 rune_tid  = 1; // ActDnfRune
  required uint64 level     = 2; // 等级
}

message act_endless_draw {
  optional uint64              count       = 1;
  optional uint64              reward_id   = 2; // 确认领取的抽卡结果id
  optional endless_draw_result last        = 3;
  optional endless_draw_result save        = 4;
  repeated endless_draw_guar   guars       = 5;
}

message endless_draw_guar {
  required uint32 sp_hero_cnt          = 1;
  required uint32 god_devil_hero_cnt   = 2;
  required uint32 purple_hero_cnt      = 3;
  required uint32 target               = 4;
  required uint32 progress             = 5;
}

message endless_draw_result {
  required uint64 id     = 1;
  repeated asset  assets = 2;
}

//============================================================
// 线索合成类活动: 新神器预热
//============================================================
message act_compose_clue {
  repeated act_compose_clue_day days = 1; // todelete byliuzf 下次开这种活动把这个字段名改掉
}

message act_compose_clue_day {
  required uint64       day         = 1;
  optional bool         recvd       = 2[default=false]; // 是否领取过奖励
  repeated  uint64      conclusions = 3; // 已得到的结论
}

message gvg_state {
  required uint64 warband_rank  = 1;
  required uint64 ts            = 2;
  required uint64 self_score    = 3;
}

message gvg_help_assist_teams {
  required uint64 source_uid = 1; // 向我求助的人
  required uint64 be_occ_ts  = 2; // 被人占的时间戳
  repeated team   teams      = 3; // 我预设的阵容
  required uint64 set_ts     = 4; // 设置阵容的时间
}

message mitama_unit {
  required uint64            id                    = 1[default=0]; //唯一id
  required uint64            tid                   = 2; //表格id
  required uint64            level                 = 3; //神器等级,客户端和战斗要
  repeated mitama_slot       slot_affixs           = 4; //词缀列表
  required uint64            exp                   = 5; //神器经验
  required uint64            add_ratio             = 6[default=0]; //加成系数
  repeated uint64            hero_ids              = 7; //穿戴的英雄列表
}


// 表格自定义英雄成长线
message mitama_hero {
  required uint64               tid       = 1; //英雄表格id
  required uint64               level     = 2[default=1]; //成长线等级
}

message mitama_event {
  required uint64         order       = 1; // 事件顺序
  repeated uint64         params      = 2; // 对于battle,来说是battle id,对于英雄来说是英雄id，对于词缀是词缀id
  optional uint64         event_tid   = 3; // 事件id
}

message golem {
  required uint64       tid       = 1; //魔像tid
  required uint64       amount    = 2; //魔像id
}

// user身上结构
message mitama {
  repeated mitama_unit       mitama_units           = 1; // 拥有的新神器列表
  optional uint64            mitama_idx             = 2; // 新神器唯一id自增
  repeated golem             golems                 = 3; // 魔像
  optional bool              is_recvd_season_reward = 4; // 是否领取过赛季奖励
  required golem_draw        golem_draw             = 5; // 魔像抽卡数据
  required uint64            cost_golden_golem_num  = 6[default = 0]; //已经消耗的金色魔像总数量
  required uint64            custom_progress        = 7[default = 0]; //产生定制卡的进度
  map<uint64, uint64>        mitama_to_cost_golem   = 8; //每种藏品消耗了多少金色魔像
}

message golem_draw {
  optional uint64                count_guar_times       = 1[default = 0]; //小保底计数,保底后清零
  optional uint64                count_guar_plus_times  = 2[default = 0]; //大保底计数,保底后清零
  required uint64                count_custom_times     = 3[default = 0]; //定制卡计数，兑换魔像定制卡,兑换后清零
  optional uint64                guar_times             = 4; //要产出小保底的次数
  optional uint64                guar_plus_times        = 5; //要产出大保底的次数
  repeated uint64                wish_golem_tids        = 6; //心愿单
  required uint64                wish_effect_times      = 7[default = 0]; //心愿单已生效次数
  required uint64                his_draw_times         = 8[default = 0]; //历史抽卡次数，用于判断心愿单解锁
}

message affix {
  required uint64             tid               = 1; //表格id
  optional uint64             quality           = 2; //品质
  required uint64             nature            = 3; //属性id
}

message mitama_slot {
  required uint64        slot      = 1;
  optional affix         affix     = 2;
  optional affix         old_affix = 3; //词条重铸后存储初始词条，用于回退和补偿
}

message golem_effect {
  repeated uint64        golem_tids      = 1; //触发效果的魔像tids
  optional affix         old_affix       = 2; //魔像效果触发前的词缀
  optional affix         new_affix       = 3; //魔像效果触发后的词缀
  repeated affix         add_affixs      = 4; //魔像效果增加的词缀
  optional mitama_slot   add_mitama_slot = 5; //魔像增加了一个词缀孔位
  optional uint64        add_ratio       = 6; //魔像额外加成系数
  repeated affix         final_affixs    = 7; //最终需要添加到玩家身上的词缀
}

