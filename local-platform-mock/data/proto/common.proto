//  乱时之境
enum t_infinite {
  infinite_pve        = 1;
  infinite_pvp        = 2;
  infinite_boss       = 3;
}

enum t_infinite_room {
  monster             = 1;
  elite_monster       = 2;
  mini_boss           = 3;
  boss                = 4;
  time_monster        = 5;
  damage_monster      = 6;
  hero_monster        = 7;
  npc                 = 8;
  pandora             = 9;
  hot_spring          = 10;
  hades               = 11;
  servant             = 12;
  initial             = 13;
}

enum t_infinite_behavior {
  battle              = 1; // 战斗
  choose_amulet       = 2; // 选择信物奖励
  choose_next_room    = 3; // 选择下一层房间
  choose_npc          = 4; // 选择npc
