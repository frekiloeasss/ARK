//-------------------------------------------------------------------
// @doc
// up和down共用协议,服务器也会直接用这边的结构,不需要含有req和reply字段
// 约定 uid为user_id, gid 为guild_id, hid 为 hero_id, ccy 为 currency
// ucs 为 universal configured structure
// 枚举类型 t_type / s_status
// @end
//-------------------------------------------------------------------
package hgame;

// 这里的名字命名方式为之前的up_msg中 req_xxx一致, 表示处理协议的模块名.
enum t_proto_module {
  none = 99; //占位符 无意义
}

// 1,2是正常结果,invalid和unknown处理为返回错误码err_battle_check_crash,其他新增结果类型需要自行处理
enum t_battle_result {
  victory   = 1;
  defeat    = 2;
  invalid   = 3; // 战斗校验奔溃
  unknown   = 4; // 某些情况下传给战斗校验的值,表示服务器在校验之前也不清楚结果究竟是什么,ex:rt_pvp两个玩家上传的结果不一致,仅用于服务器传给校验
  dmg_limit = 5; // 非法伤害，客户单可能改了脚本，导致伤害超过了策划设定的合理上线值
  dps_limit = 6; // 非法的校验结果,超过了战斗策划设定的合理值,目前用于竞速梦境
}

enum t_battle_buff {
  skill             = 1;
  buff              = 2;
  vip_buff = 3;
}

enum t_asset {
  currency           = 1;
  item               = 2;
  equip              = 3; // 包含该字段时,仅仅表示equip的TID
