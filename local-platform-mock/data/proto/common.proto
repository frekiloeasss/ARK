  required grid_pentagram grid           = 1; // 法阵格子信息
  required uint32 hero_aid_lv            = 2[default = 0]; //法阵英雄援助等级
  repeated uint32 partner_hero_ids       = 3; //法阵参与者的英雄ids(240级之前有数据)
  repeated pentagram_cell cells          = 4; //享受效果的英雄
  required uint32 pg_lv                  = 5[default = 0]; // 当前共鸣等级，开启共鸣后变为240
  required uint32 max_pg_lv              = 6[default = 0]; // 最大共鸣等级（和神话级英雄数量有关）
  optional uint32 his_max_avg_aid_lv     = 7[default = 1]; // 历史法阵英雄援助平均等级（240级之前有效）
}

message pentagram_cell{
  required uint32 cell_id = 1;
  optional cd     cd      = 2;
  optional uint64 hero_id = 3;
}

message red_packet {
  required uint32              id              =   1;
  required uint64              create_uid      =   2;
  required uint64              create_ts       =   3;
  required uint32              total_diamond   =   4;
  map<uint32, red_packet_user> receivers       =   5;
  required t_red_packet_state  state           =   6[default = not_received];
  required uint32              recv_order      =   7[default = 0];
}

message red_packet_user {
  required string     name            =   1;
  required string     avatar          =   2;
  required uint32     diamond         =   3;
  required uint64     reward_ts       =   4;
}

enum t_red_packet_state {
  not_received        =   1;
  received            =   2;
  expired             =   3;  //  红包逾期
  max_receive_times   =   4;  //  已达最大领取次数
  finished            =   5;  //  领完
}

message artifact {
  required uint32      id             = 1;
