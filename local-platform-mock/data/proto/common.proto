  optional cell_mercenary cell_mercenary   = 11; //公会抢矿助阵英雄来源
  optional uint32         height           = 12[default = 0];
  optional uint64         unlock_ts        = 13; //解锁ts 如果有 那么需要检查,时间过才可以交互
  repeated slot_hero      self_heroes      = 14; //这里是己方这边的阵容,竞猜相关,使用的机器人阵容
  repeated uint32         params           = 15; //这里存一些param数据 gamble地块存了 self oppo gamble的battle_id, 凤凰迷宫的难度等级
  optional raid_idle      raid_idle           = 16; //夏日活动英雄挂机,消耗英雄体力,产出活动内道具
  optional uint32         his_consume_act     = 17; //夏日活动特殊地块历史总消耗的英雄体力,用来判定随机事件的产生
  map<uint32, bool>       random_events       = 18; //夏日活动随机事件 <id,is_recvd>
  repeated big_rich_man_building buildings    = 19; //大富翁建筑
  optional uint32         set_oppo_lv         = 20; //设置敌方等级，guild_trial公会试炼用到该字段
  repeated uint32         oppo_golden_slots   = 21; //选择的sp英雄技能
  repeated pet            oppo_pets           = 22; //宠物
  optional uint64         expire_ts           = 23; //超时ts 如果有值 那么需要检查
  optional uint32         initial_cell_id     = 24; //初始化时候的cellID（限时会变化的格子保存cellID）
}

message raid_idle {
  optional uint64              hero_id        = 1; //地块产出和派遣的英雄相关,所以需要hero_id
  optional uint64              update_ts      = 2; //上一次更新挂机进度的时间
  optional uint32              idle_yield     = 3; //挂机进度
}

message raid_log {
  required uint32   log_id    = 1;  // RaidDisplay表的key
  required uint32   timestamp = 2;
  optional uint64   hero_id   = 3;  // 夏日活动产生日志时的英雄id
  repeated item     items     = 4;  // 夏日活动收获具体内容
  optional uint64   select_id = 5;  // 周年庆活动-选择的凶手id
}

message monthly_card {
