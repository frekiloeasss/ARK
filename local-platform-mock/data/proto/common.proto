  required uint64 bait_id   = 4; // 使用的鱼饵id
}

message fish_album {
  required uint64 tid       = 1; // 鱼的配置id
  required uint64 max_size  = 2; // 钓上来的鱼的最大尺寸
  optional uint64 reward_ts = 3; // 领取鱼的图鉴奖励的时间戳
}

message candy {
  repeated candy_unit   candy_units      = 1; // 任务列表
  required uint64       last_update_ts   = 2; // 刷新标志
  required uint32       sent_num         = 3[default = 0];     // 完成任务数
  required bool         final_reward_got = 4[default = false]; // 终极大奖领取标志
  required uint32       refresh_unit_num = 5; // 可刷新英雄个数
  repeated candy_record records          = 6; // 送糖记录
  repeated slot_hero    oppo_heroes      = 7; // 刷新出来的阵容
  repeated uint64       reward_got_cnt   = 8; // 不同级别奖励的领取次数
}

message candy_record {
