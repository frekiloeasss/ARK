//支持负数的kv
message int64kv {
  required int64  key     = 1;
  required int64  value   = 2;
}

message uint64kv {
  optional uint64 key   = 1;
  optional uint64 value = 2;
}

message asset {
  required t_asset     type    = 1;
  required t_asset_id  id      = 2; // t_asset_id currency或者daily_variable类型或者是道具类ID, 道具ID必须小于1kw
  required uint64      amount  = 3;
}

message assets {
  repeated asset assets = 1;
}

message name_card {
  required string name              = 1 [default = "New Player"];
  required uint64 last_modify_time  = 2 [default = 0];
}

//新增包含 default 值的字段一定要注意 md5 计算
message item {
  required uint32  id     = 1;
  required int64   amount = 2;
}


//新增包含 default 值的字段一定要注意 md5 计算
message equip {
  required uint32      id                = 1;
  required uint32      tid               = 2; //table_id, 配置表ID
  required uint64      amount            = 3;
  map<string, uint32>  attrs             = 4; // <"hero_tag", 种族tag_id> <"hero_tid", hero_tid> 绑定种族、英雄
  required uint32      enhance_lv        = 5 [default = 0]; // 强化等级
  required uint64      enhance_exp       = 6 [default = 0]; // 强化经验
  optional uint32      refine_tag        = 7;
  repeated uint32      his_refine_tags   = 8; //历史重铸过的tag
  optional uint32      resonate_tid      = 9; //共鸣后的装备tid,undefined标识未开启共鸣
  optional uint32      source_tid        = 10; //拉平后源装备的tid,用于计算装备种族tag和英雄tag战力
}

message sig {
  required uint32 lv = 1;
}

//新增包含 default 值的字段一定要注意 md5 计算
// 特别注意！新增字段时要注意处理unit:reset_hero/1
// 特别注意！新增字段时要注意修改unit:create_hero_with_tid/4 函数！
// 特别注意！新增字段时要注意maze、raid中与构造英雄有关的函数，如raid_util:assist_heroes/2！
message hero {
  required uint64               id                    = 1; // 英雄唯一id
  required uint32               tid                   = 2; // table_id, 配置表ID
  required uint32               quality               = 3; // 英雄星星
  required uint32               rank                  = 4 [default = 1];  // 品阶
  required uint32               level                 = 5 [default = 1]; // 等级
  required uint64               gs                    = 6 [default = 0]; // 英雄战力
  map<uint32, equip>            equips                = 7; // 装备, 固定六个, 默认为空的
  required uint32               artifact_lv           = 8 [default = 0]; //0级表示没有神器，1级才有初始属性
  optional bool                 locked                = 9 [default = false]; // 英雄锁
  repeated uint32               troops                = 10[deprecated=true]; // 英雄羁绊
  optional artifact             artifact              = 11; // 神器 前面的 artifact_lv字段暂时先不删
  optional uint32               pentagram_lv          = 12[default = 0]; // 法阵加持的等级
  optional sig                  sig                   = 13; // 英雄专属装备,undefined表示没有激活
  optional uint64               linked_hid            = 14; // 虚空英雄的链接英雄id
  optional uint32               skin                  = 15; // 英雄穿戴的时装
  optional bool                 deprecated_is_trial   = 16[deprecated=true];//废弃
  repeated furniture            furnitures            = 17; // 家具
  optional t_hero_source        source_type           = 18[default = normal];
  optional bool                 cross_key_used        = 19[default = false]; // 是否使用虚空秘钥，默认未使用
  optional hero_sp_employ       sp_employ             = 20; // （虚空英雄）特别雇佣
  map<string, uint64>           assist_hero_id        = 21; //  女仆助力的英雄id。<t_lineup, hero_id> 不同阵容，该英雄id不同
  map<uint32, uint32>           totem_node_lvs        = 22; // 刻印节点等级
  optional uint32               infinite_amulet       = 23; // 乱时之境玩法中的英雄信物
  optional uint64               backflow_fh_expire_ts = 24; // 回流英雄过期时间
  optional mitama_unit          mitama_unit           = 25; // 新神器
  optional uint64               mitama_lock_ts        = 26[deprecated=true]; // 新神器锁废弃
}

message blank_hero{
  required uint64     id                = 1; // 英雄唯一id
  required uint32     tid               = 2; // table_id, 配置表ID
  required uint32     quality           = 3; // 英雄星星
}

message setting {
  required t_setting      key    = 1;
  required string         value  = 2;
}

message ukv {
  required t_ukv    key    = 1;
  required string   value  = 2;
}

message sell_good {
  required uint32           index        = 1;
  required asset            good         = 2;
  required currency         cost         = 3;
  required bool             is_hot       = 4 [default = false];
  required bool             is_sold      = 5 [default = false];   // 为true,表示已经卖出，购买时会报错
  required uint32           discount_pct = 6 [default = 100];     // cost 为原价，需要乘以折扣/100
  optional uint32           source       = 7 [default = 0];       // 商品来源为活动ID, 其余为0
  optional bool             is_replaced  = 8 [default = false];   // 格子商品是否被替换过
  optional cd               purchase_cd  = 9;                     // 购买cd
  optional uint64           group_tid    = 10;                    // csv_shop_group.csv的key
}

//  typeId : 0:表示一般邮件 1:表示公告 , 2:紧急邮件 不可一键领取 3:之前被旧版竞技场占了,先空着 4:版本邮件 5:退款邮件 8:订阅 10:公会长老和会长发 公会邮件
message mail {
  required uint32        id              = 1 [default = 0];
  required uint64        create_ts       = 2;
  required uint64        expire_ts       = 3;
  optional mail_content  content         = 4;
  required s_mail        status          = 5 [default = unread];
  required uint32        type_id         = 6 [default = 0];
  repeated asset         assets          = 7;
  required bool          is_assets_rcvd  = 8 [default = false];
  optional uint32        global_mail_id  = 9;
  repeated l10n          l10ns           = 10;
  repeated os_mail_content  os_mail_contents  = 11;
  optional uint32        gmt_mail_id     = 12; // gmt个人邮件标识，同一批gmt个人邮件的该字段值相同。68版本暂未获得gmt支持，该字段值默认为时间戳
  optional uint64        from_uid        = 13;
}

message l10n{
  required t_lang   lang  = 1;
  required string   from  = 2;
  required string   title = 3;
  required string   body  = 4;
}

message os_mail_content {
  required t_os     os    = 1;
  required string   from  = 2;
  required string   title = 3;
  required string   body  = 4;
}

message mail_content {
  optional mail_text_content   text_content   = 1;  // 邮件内容自己定义
  optional mail_format_content format_content = 2;  // 邮件内容在Mail.csv表格里面定义
}

message mail_text_content {
  required string from  = 1;
  required string title = 2;
  required string body  = 3;
}

message mail_format_content {
  required uint32            cfg_id = 1;
  repeated ucs               params = 2;
}

message misc_reward {
  required t_misc_reward t_misc_reward    = 1;
  required reward        reward           = 2;
}

message tavern_npc {
  repeated npc    npcs      = 1;   //玩家拥有的npc
  optional uint32 cur_id    = 2;   //玩家当前使用的npc
}

message npc {
  required uint32 npc_id    = 1;    //NPC的id
  optional bool   is_trial  = 2[default = false]; //是否是试用NPC
}

// 扩展reward时需要更新hgame_oss的build_reward_assets_arg/1方法
message reward {
  repeated asset        assets    = 1;
  repeated equip        equips    = 2;
  repeated hero         heroes    = 3;
  repeated artifact     artifacts = 4;
  repeated furniture    furnitures= 5;
  repeated hero         balance_trial_heroes = 6;
  repeated mitama_unit  mitama_units         = 7;
}

enum t_misc_reward {
  t_normal    = 1;
  t_sub       = 2;
  t_starland  = 3;
}

message cost {
  repeated asset     assets    = 1;
  repeated uint32    equip_ids = 2;
  repeated uint64    hero_ids  = 3;
  repeated uint32    artifact_ids = 4;
  repeated uint32    furniture_ids= 5;
  repeated uint64    mitama_ids   = 6;
}

message task_info {
  required uint32           daily_point             = 1 [default = 0];
  required uint32           weekly_point            = 2 [default = 0];
  repeated uint32           daily_recved_chests     = 3;
  repeated uint32           weekly_recved_chests    = 4;
  repeated todo_task        daily_todolists         = 5;
  repeated todo_task        weekly_todolists        = 6;
  repeated line_task        line_tasklists          = 7;
  repeated uint32           recent_daily_points     = 8;
  optional bool             is_later_daily_reward   = 9 [default = false]; // 满足一定条件后日任务箱子会被替换
}

message todo_task {
  required uint32 id                = 1;
  required uint64 target_progress   = 2 [default = 0];
  optional uint64 last_reward_time  = 3;
}

// 用于top_honor型的任务，默认所有玩家都有该任务，但是玩家身没有该结构，如果有该结构表示已经领取过
message line_task {
  required uint32 line              = 1;
  required uint32 id                = 2;
  required uint64 target_progress   = 3 [default = 0];
  required bool   triggered         = 4 [default = false];
  repeated uint32 recvd_ids         = 5;

}

message guild_info {
  optional uint32           svr_id                  = 1;
  optional string           name                    = 2;  // 公会名 [editable]
  optional uint32           icon                    = 3;  // 公会头像 [editable]
  optional t_lang           lang                    = 4;  // 语言 [editable]
  optional int32            time_zone               = 5;  // 时区
  optional uint32           active_point            = 6 [default = 0];  // 活跃值
  optional string           desc                    = 7 [default = ""];  // 公会描述 [editable]
  optional string           apply_desc              = 8 [default = ""];  // 公会申请描述 [editable]
  optional uint32           chairman_id             = 9;  // 会长id
  optional uint64           create_time             = 10; // 创建时间
  required uint64           last_edit_time          = 11 [default = 0]; // 上次修改时间
  optional t_guild_join     join_type               = 12;
  required uint32           level                   = 13 [default = 1]; // 工会等级
  required uint64           exp                     = 14 [default = 0]; // 工会经验值
  required uint32           require_lv              = 15 [default = 0]; // 加入公会要求的玩家等级
  optional cd               guild_mail_cd           = 16;
  map <uint32, cd>          open_boss_cds           = 17; //收到开启boss的cd
  optional uint32           avg_lv                  = 18; //推荐系统使用
  optional uint32           daily_active_point      = 19 [default = 0];
  optional uint64           daily_update_ts         = 20 [default = 0];
  optional uint64           weekly_update_ts        = 21 [default = 0];
  optional uint64           strong_man_set_cnt      = 22 [default = 0];//本周设置strong_man的次数
  optional uint32           avg_stage_id            = 23 [default = 0];
  optional uint32           avg_pg_lv               = 24 [default = 0];
  optional uint64           name_prohibited_ts      = 25; // 公会名禁止修改时间
  optional uint64           desc_prohibited_ts      = 26; // 公会描述禁止修改时间
  repeated uint32           active_point_his_list   = 27; // 工会历史活跃度保留7日
  repeated uint32           avatars                 = 28; // 拥有的头像,头像字段是 icon
  optional uint32           frame                   = 29 [default = 1]; // 头像框 [editable]
  repeated uint32           frames                  = 30; // 拥有的头像框
  repeated nameplate        nameplates              = 31; // 铭牌库
}

message guild_boss_battle_records {
  required uint32                     boss_id                 = 1;
  repeated guild_boss_battle_record   entries                 = 2;
}

message guild_boss_battle_record {
  required uint64 uid       = 1;
  required uint64 damage    = 2;
  required uint64 battle_id = 3;
  required uint32 timestamp = 4;
}

message guild_boss_reward {
  map<uint64, assets>         damage2bags      = 1; //伤害->钻石福袋, 随机掉落
  map<uint64, assets>         damage2assets    = 2; //伤害->伤害宝箱开出的奖励
}

message guild_summary {
  optional uint32             id                      = 1;
  optional uint32             svr_id                  = 2;
  optional string             name                    = 3;  // 公会名     [editable]
  optional uint32             icon                    = 4;  // 公会图标    [editable]
  optional t_lang             lang                    = 5;  // 语言       [editable]
  optional string             apply_desc              = 6;  // 公会申请描述 [editable]
  optional t_guild_join       join_type               = 7;
  required uint32             level                   = 8 [default = 1]; // 工会等级
  required uint32             require_lv              = 9 [default = 0]; // 加入公会要求的玩家等级
  optional uint32             member_count            = 10; // 公会人数
  optional uint32             active_point            = 11; // 活跃值
  optional guild_gvg_his      guild_gvg_his           = 12[deprecated=true];
  repeated uint32             active_point_his_list   = 14; // 工会历史活跃度保留7日
  optional uint32             frame                   = 15 [default = 1]; // 头像框
  repeated nameplate          nameplates              = 16; // 铭牌库
}

message guild_gvg_his {
  required uint32  defeat               = 1[default = 0];
  required uint32  victory              = 2[default = 0];
  required uint32  max_straight_victory = 3[default = 0];
  required uint32  max_straight_defeat  = 4[default = 0];
  required uint32  now_straight_victory = 5[default = 0];
  required uint32  now_straight_defeat  = 6[default = 0];
  repeated gvg_his score_his            = 7;
}

message gvg_his{
  required uint32           season_id   = 1;
  required t_battle_result  result      = 2;
  required uint32           left_score  = 3;
  required uint32           right_score = 4;
}

message guild_history_entry {
  optional uint32         timestamp  = 1;
  optional uint32         content_id = 2;
  repeated ucs            params     = 3;
}

message tower {
  required tower_info     tower_info       = 1;
  repeated tower_record   tower_records    = 2[deprecated=true];
  repeated tower_info     race_tower_infos = 3;
}

message tower_info {
  required uint32       floor_id          = 1[default = 0];
  optional cd           cd                = 2;
  required t_tower      type              = 3;
  optional uint32       failure_num       = 4;
  optional tower_cd     tower_cd          = 5;//712关之前使用cd结构,之后使用tower_cd(开启跨天累计计数)
}

message tower_cd {
  required uint32       num               = 1;//当前剩余体力
  required uint64       last_restore_time = 2;//上次刷新时间
}

// 废弃,被tower_floor替代
message tower_record {
  required uint32       floor_id  = 1;
  map<uint64, uint64>   records   = 2;  //  <gs, battle_id>
}

message tower_floor {
  required t_tower      type      = 1;
  required uint32       floor_id  = 2;
  map<uint64, uint64>   records   = 3;  //  <gs, battle_id>
}

message cd {
  required uint32        id                = 1;
  required uint32        cur_point         = 2[default = 0];
  required uint64        last_use_time     = 3[default = 0];
  required uint64        last_restore_time = 4[default = 0];
  optional uint32        extra_point       = 5[default = 0]; // 额外点数，是其他方式附加的点数，作用于stone类型
}

// id基本都是唯一id, 下面几种情况是tid
// 1.预设阵容auto_import复制它人阵容
// 2.公会英雄阵容
message slot_hid {
  required uint32 slot            = 1;
  required uint64 hero_id         = 2;
  optional uint32 artifact_id     = 3;  // 70版本公会英雄阵容用到该字段
  optional uint64 mitama_unit_id  = 4;
}

message slot_hero {
  required uint32 slot  = 1;
  required hero   hero  = 2;
}

message lineup {
  required t_lineup     type                  = 1;
  repeated slot_hid     hids                  = 2;
  repeated uint32       selected_golden_slots = 3; // 选择生效的golden英雄技能，默认为[] 不选择
  repeated uint64       pet_ids               = 4; // 上阵的宠物(防止之后改为一队可上阵多个宠物定义为repeated)
}

message lineup_team {
  required t_lineup    type      = 1;
  repeated team        teams     = 2;
  optional uint64      id        = 3;
}

message team {
  optional uint32      team_id               = 1;
  repeated slot_hid    hids                  = 2;
  repeated uint32      selected_golden_slots = 3; // 选择生效的golden英雄技能，默认为[] 不选择
  repeated uint64      pet_ids               = 4; // 上阵的宠物
}

message team_with_hero {
  optional uint32      team_id               = 1;
  repeated slot_hero   slot_heroes           = 2;
  repeated uint32      selected_golden_slots = 3; // 选择生效的golden英雄技能，默认为[] 不选择
  repeated pet         pets                  = 4; // 上阵的宠物信息
}

message check_local_arena_req {
  repeated slot_hero self_hero = 1;
  repeated slot_hero oppo_hero = 2;
  required uint32    rand_seed = 3;
}

//新增包含 default 值的字段一定要注意 md5 计算
message currency {
  required t_asset_id  type    = 1;
  required int64       cnt     = 2;
}

message user_summary {
  required uint64                     uid                  = 1;
  optional uint32                     svr_id               = 2;
  optional string                     name                 = 3;
  optional uint32                     level                = 4;
  optional t_gender                   gender               = 5;
  optional string                     avatar               = 6;
  optional uint32                     frame                = 7;
  optional string                     country_or_region    = 8;
  optional t_lang                     lang                 = 9;
  optional uint32                     guild_id             = 10;
  optional string                     guild_name           = 11;
  optional t_guild_title              guild_title          = 12;
  optional uint64                     full_gs              = 13;
  optional uint64                     top_gs               = 14;
  optional uint32                     last_offline         = 15;
  optional bool                       is_online            = 16;
  optional bool                       is_unknown           = 17; // 出现异常时候, 将这个字段设为true
  optional uint32                     cur_stage            = 18;
  optional uint32                     cur_tower            = 19;
  repeated hero_summary               mercenaries          = 20;
  optional string                     city                 = 21;
  optional uint64                     arena_defend_gs      = 22; // 竞技场防守战力
  optional uint64                     top_arena_def_gs     = 23; // 巅峰竞技场防守战力
  repeated uint32                     troop_ids            = 24; // 玩家的羁绊,各个模块计算战斗数据需要用到
  repeated tower_info                 race_towers          = 25;
  optional bool                       guild_strong_man     = 26; // 公会精英
  optional bool                       is_deleted           = 27;
  optional uint64                     best_15_gs           = 28;
  repeated uint64                     champion_def_gs_list = 29; // 每一个队伍的战力分开存储
  optional astrolabe                  astrolabe            = 30;
  optional uint32                     pg_lv                = 31;
  optional user_summary_homeland_gift homeland_gift        = 32;
  optional uint32                     homeland_gs_radio    = 33[default = 0]; // 家园提供的战力加成总和
  optional uint64                     vip_exp              = 34;
  repeated user_gmt_cmd               gmt_cmds             = 35; // gmt 对 玩家的状态干预
  repeated exhibited_emblem           exhibited_emblems    = 36; // 徽章展示数据
  optional uint64                     create_ts            = 37[default = 0]; // 创角时间，62版本添加
  optional uint32                     guild_icon           = 38; // 公会icon
  optional nameplate                  nameplate            = 39; // 铭牌
  optional t_display_opt              display_opt          = 40[default = lv]; // 显示设置
  repeated nameplate                  nameplates           = 41; // 铭牌库
  optional string                     ip_location          = 42; // 玩家ip地址所在地，精确到省
  optional uint32                     guild_frame          = 43; // 工会头像框
  repeated nameplate                  guild_nameplates     = 44; // 工会铭牌
}

enum t_display_opt {
  lv          = 1;    // 默认显示
  nameplate   = 2;    // 显示铭牌
}

enum t_nameplate_type {
  curseland_govern    = 1; // 诅咒梦境主榜
  curseland_minor     = 2; // 诅咒梦境分榜
  idle_pvp            = 3; // 挂机竞技场
  side_endless_pet    = 4;
  side_endless_normal = 5;
  race_dream          = 6; // 竞速梦境
  side_endless_boss   = 7;
  guild_level         = 8; // 工会铭牌 - 等级
  camp_pvp            = 9; // 阵营赛
}

message nameplate {
  optional uint32             rank                    = 1; // 名次
  optional uint32             pct_rank_deprecated     = 2[deprecated=true]; // 百分比名次
  optional uint64             expire_ts               = 3; // 过期时间
  optional uint32             total                   = 4; // 排行榜总人数
  optional uint32             percent                 = 5; // 百分之几 * 10 (比如85代表百分之八点五， 110代表百分之11， 490代表百分之49)
  optional t_nameplate_type   type                    = 6[default = curseland_govern]; // 铭牌类型
  optional uint32             param                   = 7; // 其余信息，例如对于 curseland_minor 类型来说，这里存的是 lgd_id（巅峰竞技场大区）
  optional uint64             tid                     = 8; // 铭牌id csv_avatar_nameplate表格tid
}

message user_gmt_cmd{
  required string            key                 = 1;
  optional uint64            expire_ts           = 2;
}

message user_summary_homeland_gift {
  optional uint32        best_homeland_gift   = 1; // undefined 未生成；0 礼物不可见；> 1 最佳礼物id
  optional uint64        last_update_ts       = 2[default = 0];
}

message local_arena_record {
  required uint64          timestamp     = 1;
  required user_summary    oppo_summary  = 2;
  required uint64          oppo_gs       = 3;
  required t_battle_result result        = 4;
  required int64           point_change  = 5;
  required uint64          replay_id     = 6;
  required uint64          can_fight_cnt = 7;
  optional uint64          att_uid       = 8; // 进攻方uid
  optional bool            is_robot      = 9[default = false];
}

message battle {
  required t_battle            type             = 1;  // 客户端传，服务器校验
  required battle_common       common           = 2;  // 战斗校验参数模块 包含类型 随机种子等
  optional battle_input        input            = 3;  // 战斗校验输入模块
  optional battle_output       output           = 4;  // 战斗校验输出模块，用来跑录像和做简要信息
  optional bytes               d_test           = 5;  // 战斗屏蔽表格的数据
}

message battle_common {
  optional uint32              rand_seed        = 1;  // 随机种子
  optional uint32              param            = 2;  // stage为关卡stage_id, tower为floor_id
  repeated battle_buff         self_buffs       = 3;  // 己方buff, buff在各个功能模块可能读不通buff表
  repeated battle_buff         oppo_buffs       = 4;  // 敌方buff, buff在各个功能模块可能读不通buff表
  repeated uint32              self_troop_ids   = 5;  // 己方troop_ids
  repeated uint32              oppo_troop_ids   = 6;  // 地方troop_ids
  repeated uint64              param_list       = 7;  // 存放一些param字段 activity_boss :[最强战力]
  optional astrolabe           self_astrolabe   = 8;
  optional astrolabe           oppo_astrolabe   = 9;
  repeated relic_pic           self_relic_pics  = 10;
  repeated relic_pic           oppo_relic_pics  = 11;
  optional int32               infl_weight      = 12[default = 0];
  optional uint32              gve_oppo_equip_group_tid = 13;
  repeated hero_gve_equips     self_gve_equipss = 14;
  optional uint32              lv_offset        = 15; // 关卡等级调整值，62版本新增。用于推关战斗
  repeated int32               infl_weight_list = 16; // list for 12 多队战斗的一些兼容
  repeated uint64              self_params      = 17; // 一些额外的参数, rt_pvp 传入这个玩家所有拥有的卡的tid
  repeated uint64              oppo_params      = 18; // 同上
  optional relic_core          self_relic_core  = 19;
  repeated hero_stance         rt_self_heroes_list = 20; // 己方待上阵英雄的tids, 暂时只有rt_pvp 用到, 需要纯拉平设计
  repeated hero_stance         rt_oppo_heroes_list = 21; // 同上
  map<uint32, uint32>          self_infinite_inst_lvs = 22; // 命运清单 <id, lv>
  repeated team_buffs          team_buffs       = 23;
  map<uint64, uint64>          hid_shield       = 24; // 溢出治疗量形成的护盾<hid, 溢出的万分比>
  repeated infinite_amulet     self_infinite_amulets = 25; //rog信物
  optional bool                is_sidestory_degrade  = 26; // boss支线下放副本难度降低
  repeated uint64              golem_tids            = 27; // 魔像
  optional uint64              self_dragon_stela_lv  = 28; // 己方龙族石碑等级
  optional uint64              oppo_dragon_stela_lv  = 29; // 敌方龙族石碑等级
}

message team_buffs {
  required uint64             team_id           = 1;
  repeated uint64             buffs             = 2;
}

message hero_stance {
  required uint32 tid         = 1;
  required uint32 slotId      = 2;
}

message rt_battle_heroes {
  required t_rt_hero_appear    appear_type      = 1;
  repeated hero_stance         hero_stances     = 2;
}

message battle_buff {
  required uint32              buff_id          = 1;  //对应skill表的skill_id,表中caster_id是战斗策划通过战斗类型对应出来的,所以服务器只需要发skill_id即可
  repeated uint32              params           = 2;
  optional t_battle_buff       type             = 3[default = buff];
}

message battle_input {
  repeated battle_team         self_teams       = 1;  // 己方多队多人阵容，1v1模块为单队多人阵容
  repeated battle_team         oppo_teams       = 2;  // 敌方多队多人阵容，1v1模块为单队多人阵容，PVE一般为空列表
  repeated round_op            round_ops        = 3;  // 每一局的操作序列
  optional uint64              start_ts         = 4;  //开始时间
  optional uint64              end_ts           = 5;  //结束时间
  repeated battle_stats        stats_list       = 6; //额外请求战斗校验返回的参数
}

message round_op {
  map<uint32, battle_ops>     operations       = 1;  // <tick, battle_ops>, 英雄每一局的操作序列
}

message battle_output {
  repeated battle_round        rounds           = 1;  // 一场比赛多局信息
  optional uint64              battle_time      = 2; //战斗时长
  repeated battle_stats        stats_list       = 3; //额外请求战斗校验返回的参数
}

message battle_team {
  repeated slot_hero          slot_heroes           = 1;  // 按格子位置放置的英雄
  map<uint64, hero_dyn>       dyns                  = 2;  // 开场时候英雄血，蓝等信息
  map<uint64, uint64>         hid2uids              = 3;  // 借兵系统hid:uid
  repeated user_summary       friend_summaries      = 4;  // 佣兵相关好友信息
  repeated uint32             selected_golden_slots = 5;  // 生效golden英雄特殊技能的位置 暂时每一队只有一个位置生效，即只可能为[]或者[uint32]
  repeated pet                pets                  = 6;  // 宠物
}

message battle_ops{
  repeated uint64             ops               = 1; //  英雄操作序列
}

enum t_battle_defeat {
  normal   = 1;
  timeout  = 2;
}

message battle_round {
  required uint64             round             = 1[default = 1];  // 第N局ID
  required t_battle_result    result            = 2;  // 第N局结果
  optional battle_team        self_team         = 3;  // 己方队伍
  optional battle_team        oppo_team         = 4;  // 敌方队伍
  optional round_op           round_op          = 5;  // 一局比赛的操作序列
  map<uint64, hero_stat>      self_stats        = 6;  // 离场时己方血，蓝数据
  map<uint64, hero_stat>      oppo_stats        = 7;  // 离场时敌方血，蓝数据
  map<uint64, pet_stat>       self_pet_stats    = 8;  // 离场时己方宠物造成伤害和治疗
  map<uint64, pet_stat>       oppo_pet_stats    = 9;  // 离场时地方宠物造成伤害和治疗
  optional uint64             oppo_team_id      = 10; // 敌方队伍id,用于获取额外的战斗配置
  optional uint64             self_team_id      = 11; // 己方队伍id,用于记录车轮战对应关系
  optional t_battle_defeat    defeat_reason     = 12; // 战斗失败的原因 比如超时
  map<uint64, hero_stat>      helper_stats      = 13; // 离场时伙伴造成的（伤害、治疗、防御）
}

message battle_stats{
  required uint64             id                 = 1;
  optional uint64             value              = 2;
  optional uint64             round              = 3;
  optional bool               result             = 4;
}

// 战斗开始动态信息
message hero_dyn {
  required uint64    hp_pct   = 1;
  required uint64    mp_pct   = 2;
  optional uint64    param    = 3;
  repeated uint64    params   = 4;  // require by jiaruo 由于boss支线上面的param不够用了，加了一个params数组
}
// 战斗结束剩余统计信息
message hero_stat{
  required uint64    hp_pct   = 1;
  required uint64    mp_pct   = 2;
  required uint32    param    = 3; // 比如骷髅王复活状态
  required uint64    damage   = 4;
  required uint64    kill     = 5;
  required uint64    heal     = 6; // 治疗
  required uint64    defend   = 7; // 防御
}

message pet_stat {
  required uint64    damage   = 1;
  required uint64    heal     = 2; // 治疗
}

message battle_record {
  required uint64               battle_id         = 1;  // 战斗唯一ID
  required battle               battle            = 2;  // 战斗结构体
  required t_battle_result      battle_result     = 3;  // 战斗结果
  optional string               cli_ver           = 4;  // 战斗校验版本号, 竞技场等该字段可能为空
  optional string               bt_svr_ver        = 5;  // 战斗校验版本号
  optional user_summary         self_summary      = 6;  // 己方user_summary
  optional user_summary         oppo_summary      = 7;  // 对方user_summary
  optional battle_record_param  param             = 8;  // 战斗录像需要的额外参数，比如公会boss伤害奖励
  optional uint64               create_ts         = 9[default = 0]; //战报生成时间
  optional bool                 is_retained       = 10[default = false];  // 跨版本是否保留
  optional string               hbase_family      = 11 [default = "t"]; // "t" 保存30天 "k"一年 "m3"一百天
}

message battle_record_param {
  optional guild_boss_reward      guild_boss_reward    = 1;
  optional activity_boss_reward   activity_boss_reward = 2;
  repeated uint64                 params               = 3; //战斗录像需要展示的额外数据 竞速梦境：单队伤害
}

message quest {
  reserved 5;
  required uint32           id           = 1;
  required uint64           expire_ts    = 2; // 任务被刷掉的时间
  optional uint64           start_ts     = 3;
  repeated hero             self_heroes  = 4;
  repeated asset            assets       = 6; // 任务的奖励
  map<uint32, hero_summary> assit_heroes = 7;
  optional bool             is_sub       = 8[default = false]; // 是否是订阅刷新的
  optional bool             is_double    = 9[default = false]; // 是否被翻倍过
}

message sub {
  required t_os   t_os      = 1 [default = ios];
  required uint32 good_id   = 2 [default = 0];
  required uint64 expire_ts = 3 [default = 0];
  required bool   is_opened = 4 [default = false]; // 功能首次开启需要红点通知
  optional t_sub_reminder  t_sub_reminder = 5;
}

message idle {
  required uint64         calc_ts         = 1; //  上次计算的时间
  repeated uint32         left_secs       = 2; //  上次计算各个奖励结余的时间 现在 currency 和chest 使用统一逻辑
  required uint64         end_ts          = 3; //  结束时间
  repeated asset          assets          = 4; //  金币;经验;英雄经验;宝箱(实际上道具+装备)
  required uint64         start_ts        = 5; //  开始的时间
  repeated asset          sub_assets      = 6; //  特殊权限加成，客户端需要单独显示
  required starland_idle  starland_idle   = 7;//  群星之幕加成
}

message starland_idle {
  repeated asset       assets         = 1;
  repeated left_asset  left_assets    = 2;
}

//universal configured structure
message ucs {
  optional uint64       int_val        = 1;
  optional string       string_val     = 2;
  repeated slot_hero    slot_heroes    = 3;
  optional reward       reward         = 4;
}

// 格子
message grid {
  required uint32      grid_buy        = 1 [default = 0]; // 英雄格子 包含基础格子+vip格子+购买的格子
  optional uint64      mitama_grid_buy = 2 [default = 0]; // 藏品格子
}

// 法阵格子
message grid_pentagram {
  required uint32      pentagram_coin_buy       = 1 [default = 0]; // pentagram_coin 购买的格子
  required uint32      total                    = 2 [default = 0];
  required uint32      diamond_buy              = 3 [default = 0]; // diamond 购买的格子
}

message shop {
  required uint32    id            = 1;
  repeated sell_good sell_goods    = 2;
  required cd        cd            = 3;     //商店主动刷新cd
  required uint32    refresh_times = 4;
  map<uint32, uint32> purchase_his      = 5; // 限购项的已购买次数，每月重置,用于限购项到达限制后替换货物
  optional cd         purchase_limit_cd = 6; // 限购cd
  optional uint64     end_ts            = 7; // 关闭时间，水晶商店有关闭倒计时
}

message dragon_tower_info {
  optional uint64                         start_ts      = 1;    // 开启时间
  optional uint64                         end_ts        = 2;    // 关闭时间
}

enum t_cell {
  normal          = 0;
  elite           = 1;
  hot_spring      = 2;
  boss            = 3;
  empty           = 4;
  start           = 5;
  mystic          = 6;
  peddler         = 7;
  thief           = 8;
  carriage        = 9;
  goblin          = 10;
  bloody_carriage = 11;
  deep_normal     = 12;
  deep_elite      = 13;
  deep_guard_low  = 14;
  deep_guard_medium = 15;
  deep_boss       = 16;
  deep_spring     = 17;
  deep_witch      = 18;
  deep_elite_double = 19;
  deep_goblin     = 20;
}

enum s_cell {
  not_yet = 0;
  passed  = 1;
}

message maze {
  required uint64             uid                             = 1;
  required uint32             id                              = 2[default = 1];
  required uint32             floor_id                        = 3[default = 1];
  required uint32             cell_id                         = 4[default = 1];
  required uint64             gs                              = 5[default = 0];        //迷宫开启时历史最高战力
  repeated cell               cells                           = 6;
  map<uint64, hero_dyn>       dyns                            = 7;                     // <HeroID, HeroDyn>
  repeated uint32             heirlooms                       = 8;                     // 本次不可使用的遗物 + 已经选择过的遗物
  repeated uint32             path                            = 9;                     // 走过的cell_id, 不包含当前cell_id
  required uint64             end_time                        = 10[default = 0];       // 迷宫结束时间
  optional uint32             torches                         = 11;                    // 火把数量(废弃)
  repeated hero               assist_heroes                   = 12;                    // 拥有的助战英雄
  optional uint32             counter                         = 13[default = 0];       // 迷宫计数器，第几次迷宫
  repeated heirloom_param     heirloom_params                 = 14; // 遗物
  required uint32             map_id                          = 15[default = 1];       // map_id
  optional uint32             tear_times                      = 16[default = 0];
  optional t_maze_type        type                            = 17[default = normal];  // 迷宫模式
  optional double             reward_ratio                    = 18[default = 1.0];     // 奖励倍率
  optional uint32             missed_times                    = 19[default = 0];       // 错过次数
  optional bool               is_deep_open                    = 20[default = false];   // 本次迷宫,是否满足深渊开启条件
  optional uint32             roll_times                      = 21[default = 0];       // 深渊重roll敌方阵容的次数(废弃)
  optional uint32             triggered_id                    = 22[default = 0];       // 最后一次触发过冲动礼包的maze_big_season
  repeated uint32             offset_ids                      = 23;                    // 深渊减buff券抵消掉的 debuff_id
  optional uint32             ticket_times                    = 24[default = 0];       // 深渊减buff券使用次数
  optional uint32             battle_victory_times            = 25[default = 0];       // 战斗胜利次数
  optional uint32             multi_team_battle_victory_times = 26[default = 0];       // 多队战斗胜利次数
  optional uint64             team_id                         = 27; // 深渊迷宫队伍id
  map<uint64, uint64>         recvd_invites                   = 28; // 收到的组队邀请<team_id, uid>,有上限
  repeated uint64             apply_team_ids                  = 29; // 申请过的队伍ID,有上限
  repeated maze_path_record   maze_path_records               = 30; // 有小队情况下记录每一层通关所经过的cell
  repeated uint64             recent_pass_ts                  = 31; // 记录近期通关的时间点(eg:近30天通关多少次)
  optional uint64             expire_ts                       = 32; // 以活动形式开启组队，记录本次活动结束时间，用于清理队伍信息
  optional maze_qk_chlg       qk_chlg                         = 33; // v99快速挑战，默认undefined，快速挑战时初始化数据
  optional uint64             deep_past_counter               = 34[default = 0]; // 深渊迷宫三层的通关次数
}

message maze_qk_chlg {
  optional shop                   shop            = 1; // 旅行商人
  optional bool                   buy             = 2[default = false]; // 旅行商人是否已买完
  repeated maze_qk_chlg_heirloom  heirlooms       = 3; // 遗物
  required uint32                 heirloom_index  = 4[default = 0]; // 当前选到第几个遗物
}

message maze_qk_chlg_heirloom {
  required uint32 index           = 1; // 索引,从0开始
  repeated uint32 heirlooms       = 2; // 每次三选1
  optional uint32 select_heirloom = 3; // 选中的遗物
}

message team_hero_summary {
  required uint64            owner_uid    = 1;
  required hero_summary      hero         = 2;
}

message team_hero {
  required uint64            owner_uid    = 1;
  required hero              hero         = 2;
}

message maze_path_record {
  required uint32        floor_id   = 1;  //层数
  map<string, uint32>    pass_cells = 2;  //通关的格子<cell_type,num> 因map不支持枚举为key,所以type需转换为string
}

message old_maze {
  required uint32        id             = 1[default = 1];
  required uint32        floor_id       = 2[default = 1];
  required uint32        cell_id        = 3[default = 1];
  required uint64        gs             = 4[default = 0]; //迷宫开启时历史最高战力
  repeated cell          cells          = 5;
  map<uint64, hero_dyn>  dyns           = 6; //<HeroID, HeroDyn>
  repeated uint32        heirlooms      = 7;
  repeated uint32        path           = 8; //走过的cell_id, 不包含当前cell_id
  required uint64        end_time       = 9[default = 0]; //迷宫结束时间
  optional uint32        torches        = 10;//火把数量
  repeated hero          assist_heroes  = 11;//拥有的助战英雄
  optional uint32        counter        = 12[default = 0];//迷宫计数器，第几次迷宫
  repeated heirloom_param heirloom_params = 13;
}

message cell {
  required uint32       id               = 1;
  required t_cell       type             = 2;
  required s_cell       status           = 3  [default = not_yet];
  repeated asset        assets           = 4;
  repeated slot_hero    oppo_heroes      = 5[deprecated=true];
  map<uint32, hero_dyn> oppo_dyns        = 6[deprecated=true]; //<HeroID, HeroDyn>
  optional shop         shop             = 7; // 旅行商人
  repeated uint32       heirloom_pool    = 8; // 可选 heirloom,选择遗物后将被清空
  repeated uint32       picked_heirlooms = 9; // 已选择的遗物
  repeated hero         assist_heroes    = 10; // 可选择的助战英雄
  optional bool         special_reward   = 11[default = false];// 战斗special_reward待领取
  repeated uint64       tired_heroes     = 12; // 已经使用过的英雄
  repeated maze_enemy   enemies          = 13; // 多队敌人
  repeated uint64       tired_pets       = 14; //已经使用过的宠物
}

message maze_enemy {
  optional uint32        enemy_id     = 1;
  repeated slot_hero     oppo_heroes  = 2;
  map<uint64, hero_dyn>  oppo_dyns    = 3; //<HeroID, HeroDyn>
  optional bool          defeated     = 4[default = false];
}

message maze_torch_record {
  required uint32        cell_id     = 1;
  required string        name        = 2;
}

message raid_status {
  optional uint32                       raid_id                 = 1;//table_id
  repeated uint32                       recved_rewards          = 2;//已领取的一次性奖励
  repeated uint32                       detected_blocks         = 3;//已探开的格子
  required bool                         finished                = 4[default = false];//finish标记
  optional uint64                       gs                      = 5[default = 0];//活动迷宫活动期间不变
  optional uint32                       act_id                  = 6;  //活动id;mystic的season_id
  optional uint64                       create_ts               = 7;  //创建时间
  repeated raid_recved_diy_rewards_info recved_diy_rewards_info = 8;  //已领取的diy奖励
  required string                       raid_key                = 9;  //key
  repeated uint32                       his_heirlooms           = 10; //dilemma的历史词条
}

message raid_boss_record{
  required uint64 replay_id = 1;
  required uint64 damage    = 2;
  required uint64 create_ts = 3;
}

// 遗物商店货币产出绑定在reward上面,商店本身不随着<close/open>而刷新,同一个地图上只有一个商店
message raid_heirloom_shop{
  map<uint32, uint32>                   buy_times               = 1; // 遗物购买的次数<ID, 次数>
}

message raid_recved_diy_rewards_info {
  required uint32 reward_id           = 1;
  repeated uint32 recvd_slot_ids      = 2;
}

enum t_raid {
  story                = 1;
  activity             = 2;
  mystic_tower         = 3;
  heroes_lore          = 4;
  dilemma              = 5;
  anniv                = 6;
  act_summer           = 7;
  big_rich_man         = 8;   // 大富翁
  act_hyper_tl         = 9;   // 凤凰迷宫
  act_detective        = 10;  // 周年庆探索迷宫
  act_summer_2022      = 11;  // 2022年夏活
  act_raid_food        = 13;  // 2023周年庆
  act_celebration_2023 = 14;  // 2023 双旦活动
  hero_story           = 15;  // 英雄奇境,目前只有sp英雄
  act_raid_care_pet    = 16;  // 2024周年庆
  act_raid_journey     = 17;  // 2024年夏活
}

message guild_mine_oppo {
  required uint64             uid              = 1; // 对手uid
  required uint64             expire_time      = 2;
  required assets             assets           = 3;
  // 可掠夺的总时间,每个cell可掠夺百分比*robbed_time为扣除对方的总时间
  required uint32             left_robbed_time = 4;
}

message raid {
  optional uint32             id                 = 1;//table_id
  required uint32             cur_map            = 2[default = 0];
  required uint32             cur_block          = 3[default = 0];
  optional uint64             gs_deprecated      = 4[deprecated=true];
  repeated raid_block         blocks             = 5;
  map<uint64, hero_dyn>       dyns               = 6;
  repeated uint32             heirlooms          = 7; //当前拥有的遗物
  repeated hero               assist_heroes      = 8;
  map<uint32, uint64>         effect2cnt         = 9;//Effect生效次数
  repeated uint32             battle_hero_tids   = 10;//最近一次战斗的英雄Table ID
  repeated string             histories          = 11;//策划所配置的history
  repeated raid_log           logs               = 12;//探索日志
  repeated heirloom_param     heirloom_params    = 13;//遗物参数
  optional guild_mine_oppo    guild_mine_oppo    = 14;
  repeated raid_sprite        sprites            = 15;//sprite 动画
  map<uint32, raid_diy_reward>diy_rewards        = 16; //<reward_id, rewards>
  // 试玩迷宫key形式: raid_type:raid_tid:csv_heroes_lore_id:hero_tid
  // 其他迷宫key形式: raid_type:raid_tid
  required string             key                = 17; //raid key 唯一主键
  optional uint64             heirloom_coin      = 18[default = 0];
  optional raid_heirloom_shop heirloom_shop      = 19; //遗物商店
  repeated int64kv            items              = 20; //迷宫背包物品
  repeated m_hero_act         hero_acts          = 21; // 英雄体力
  optional big_rich_man_info  big_rich_man_info  = 22; // 大富翁相关
  optional raid_act           raid_act           = 23; //迷宫体力,解锁迷雾消耗
  optional uint64             skin_id            = 24; //马车皮肤id
  optional raid_detective_info detective_info    = 25; //失落荣光相关数据(2022周年庆)
  optional raid_heirloom_boss heirloom_boss_info = 26; // 遗物boss相关
  repeated uint64             unlock_area_ids    = 27; // 已解锁的地图区域
  optional raid_puffer_fish   puffer_fish_info   = 28; // 河豚号(2022夏日活动)
  repeated raid_task          tasks              = 30; // 迷宫内任务信息
  repeated uint64             must_hero_tids     = 31; // effect触发后的必须上阵的英雄
  optional t_raid_world       raid_world         = 32; // 当前环境状态
  optional uint64             task_board_id      = 33; // 当前小游戏任务面板ID（0表示没有开启的游戏）
}

message raid_task {
  required uint64             task_id            = 1; //任务ID
  required uint64             group_id           = 2; //任务组ID
  required uint64             progress           = 3; //任务内容进度
}

message raid_puffer_fish {
  required uint64 shard_index     = 1[default = 0];     // 已领取的藏宝图索引
  repeated uint64 shards          = 2;                  // 玩家身上的藏宝图碎片
  repeated uint64 boat_components = 3;                  // 船体零件
  required bool   shards_active   = 4[default = false]; // 藏宝图碎片已激活了吗？
}

message raid_heirloom_boss {
  repeated         raid_team_heirlooms             team_heirlooms   = 1; // raid遗物boss上次所选遗物
  map<uint64,      raid_heirloom_boss_dmg_rewards> boss_reward_map  = 2; // 伤害奖励信息
  repeated         uint64                          unlock_boss_list = 3; // 当前解锁的boss列表
}

message raid_detective_info {
  repeated uint64             clues                        = 1; //周年庆-当前持有的线索(id数组)
  repeated uint64             deprecated_unlock_boss_list          = 2[deprecated=true]; //周年庆-当前解锁的小boss
  repeated raid_detective_heirlooms deprecated_detective_heirlooms = 3 [deprecated=true]; //周年庆-配置使用的遗物
  map<uint64, uint64>         mini_boss_battle_cnt         = 4; //周年庆-小boss战斗次数
  optional uint64             cur_select_target            = 5; //周年庆-当前选择的凶手id
  optional bool               guess_target_status          = 6; //凶手是否猜对 undefined表示未结算
  repeated uint64             recvd_clues_reward           = 7; //周年庆-线索收集奖励
  map<uint64, raid_detective_dmg_rewards> deprecated_boss_reward_info = 8; // 伤害奖励信息
  map<uint64, uint64>         clue_uid                     = 9; //线索以及对应的排行榜top1
}

// 已废弃
message raid_detective_heirlooms {
  required uint64             id               = 1; //队伍id
  required uint64             boss_id          = 2; //bossid
  repeated uint64             active_heirlooms = 3; //选择的遗物
}

message raid_team_heirlooms {
  required uint64             id               = 1; //队伍id
  required uint64             boss_id          = 2; //bossid
  repeated uint64             active_heirlooms = 3; //选择的遗物
}

// 已废弃
message raid_detective_dmg_rewards {
  optional uint64             max_reward_id    = 1[default = 0]; //当前可领取的最大奖励id
  repeated uint64             recvd_list       = 2; //已领取列表
}

message raid_heirloom_boss_dmg_rewards {
  optional uint64             max_reward_id    = 1[default = 0]; //当前可领取的最大奖励id
  repeated uint64             recvd_list       = 2; //已领取列表
}

message raid_act {
  required uint64             point          = 1[default=0];
  required uint64             last_update_ts = 2[default=0];
}

message big_rich_man_info {
  optional   uint64                       exp              = 1[default = 0];   // 经验，用来计算领地等级
  optional   uint64                       rob_dice_sum     = 2[default = 0];   // 总的入侵步数
  optional   uint64                       rob_dice_cnt     = 3[default = 0];   // 已经走了多少步
  optional   uint64                       uid              = 4;                // 入侵的目标
  repeated   big_rich_man_effect          effects          = 5;                // 效果id - 产生效果的地块id，便于计算距离
  repeated   big_rich_man_effect          rob_effects      = 6;                // 入侵时的效果（由于自己的领地有特殊建筑，增益入侵效果）
  optional   double                       add_rob_resource = 7;                // 入侵时提升的资源获取百分比
  repeated   uint32                       ban_hero_ids     = 8;                // 需要禁用的英雄id
  repeated   big_rich_man_battle_record   records          = 9;                // 掠夺过程
  optional   uint32                       stage_id         = 10;               // 推关数
  repeated   uint32                       tmp_ban_hero_ids = 11;               // 需要临时禁用的英雄id
  repeated   uint32                       used_hero_ids    = 12;               // 使用过的英雄id
  repeated   big_rich_man_rob_dice_record rob_dice_records = 13;               // 掷骰子记录
  optional   uint32                       star_num         = 14[default = 0]; // 星星数
  optional   uint32                       base_morale      = 15[default = 0];  // 基础士气值(需要叠加effects后才是当前的)
  optional   double                       morale_add_reward= 16[default = 0];  // 士气值增加的收益百分比
  optional   uint32                       min_morale       = 17[default = 0];  // 最低士气值
  optional   uint32                       max_morale       = 18;               // 最高士气值(由领地等级决定)
  repeated   uint32                       last_battle_hero_tids = 19;          // 最后一场战斗使用的英雄tid
  optional   uint64                       sub_morale       = 20[default = 0];  // 扣掉的士气
}

message big_rich_man_effect {
  required uint32  effect_id        = 1; // 效果id
  required uint32  source_block_id  = 2; // 效果产生地块的id
}

message def_building_debuff {
  required t_big_rich_man_building   building  = 1; // 建筑类型
  required uint32                    lv        = 2; // 建筑等级
}

message raid_diy_reward{
  map<uint32, asset>        diy_assets       = 1; // <idx, rewards>
}

enum s_raid_sprite {
  normal    =  0;
  hidden    =  1;
  inactive  =  2;
}

message raid_sprite {
  required uint32           id               = 1;
  required s_raid_sprite    status           = 2;
  required uint32           block_id         = 3;
  optional uint32           target_block_id  = 4;
}

message heirloom_param {
  required uint32 heirloom = 1;
  repeated uint32 params   = 2;
}

enum s_raid_block {
  normal                  = 0;
  hidden                  = 1;
  can_not_view            = 2; //不能解锁周围周围迷雾类型
}

message cell_mercenary {
  optional uint64 uid    = 1;
  optional string sign   = 2;
}

message raid_block {
  required uint32         id               = 1;
  required uint32         cell_id          = 2;
  required s_raid_block   status           = 3[default = hidden];
  map<uint64, hero_dyn>   oppo_dyns        = 4; //<HeroID, HeroDyn>
  repeated uint32         heirloom_pool    = 5; //可选heirloom
  repeated hero           assist_heroes    = 6; //可选择的助战英雄
  required uint64         battle_win_cnt   = 7[default = 0];
  required uint64         battle_lost_cnt  = 8[default = 0];
  repeated slot_hero      oppo_heroes      = 9;
