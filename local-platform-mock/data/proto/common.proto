//  乱时之境-pve房间
message infinite_pve_room {
    required uint64                 id                      = 1; // 配表中随机使用的主键id
    required t_infinite_room        type                    = 2; // 类型
    repeated hero                   hero_opts               = 3; // 可选英雄，某些类型会用到
    repeated infinite_amulet_opt    amulet_opts             = 4; // 战斗后生成的信物词条选项
    repeated uint64                 npc_opts                = 5; // 可选的npc
    optional uint64                 enemy_gs_id             = 6; // 根据房间类型和楼层���成的敌人战力配置id
    repeated infinite_pve_enemy     enemies                 = 7; // 对面的阵容
    required uint64                 create_ts               = 8; // 房间创建的时间
