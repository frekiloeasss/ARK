message idle_pvp_lineups {
  repeated idle_pvp_lineup    lineups = 1;
}

message idle_pvp_lineup {
  required uint64 rank_level      = 1; // 段位
  repeated lineup rank_lineups    = 2; // 阵容
}

// 排行信息
message idle_pvp_ranking_info {
  required uint64 ts              = 1[default = 0]; // 上次查询的时间
  required uint64 score           = 2[default = 0]; // 上次查询时的积分
  required uint64 his_max_score   = 3[default = 0]; // 上次查询时历史最高积分
  required uint64 ranking         = 4[default = 0]; // 上次查询时的排名
  required uint64 player_num      = 5[default = 0]; // 上次查询时总参赛人数
}

// 数据大厅
message idle_pvp_battle_his {
  required uint64                     id          = 1; // days * 1000 + rankLevel * 100 + rankSect * 10 + team_id. rankSect:排行榜所在分段, rankLevel:段位
  required uint64                     day         = 2; // 活动第几天
  repeated uint64                     hero_ids    = 3; // 上阵的英雄id
  required uint64                     bt_cnt      = 4[default = 0]; // 战斗场数
  required uint64                     win_cnt     = 5[default = 0]; // 胜利场数
  repeated idle_pvp_report_lineup     win_lineup  = 6; // 战胜过的敌人阵容（只存英雄tid）
  repeated idle_pvp_report_lineup     lost_lineup = 7; // 输过的敌人阵容（只存英雄tid）
  repeated uint64                     pet_ids     = 8; // 上阵的宠物id
}

message idle_pvp_report_lineup {
  repeated uint64 hids = 1; // 上阵了哪些英雄
}

message idle_pvp_battle_record {
  required uint64             team_id         = 1; // 队伍id
  required bool               is_self         = 2;
  optional uint64             oppo_uid        = 3; // 敌方uid
  repeated uint64             oppo_hero_ids   = 4; // 敌方阵容
  repeated uint64             self_hero_ids   = 5; // 自己的阵容
  optional battle_output      output          = 6; // 临时存下战斗结果，只存血量信息
  optional t_battle_result    battle_result   = 7; // 临时存下战斗结果
  required uint64             rand_seed       = 8;
  required uint64             rank_level      = 9;
  required uint64             route_id        = 10;
  optional int64              self_score_add  = 11; // 自己的分数变化
  optional int64              oppo_score_add  = 12; // 敌方的分数变化
  optional int64              oppo_before_score  = 13; // 敌方初始分数
  optional uint64             oppo_team_id    = 14; // 地方队伍id
}

// 数据大厅
// 查询统计信息
message idle_pvp_statistics {
  required uint64                     id          = 1; // 当天00:00:00时间戳
  required uint64                     bt_cnt      = 2; // 当天总战斗次数
  repeated idle_pvp_statistic         statistics  = 3;
  repeated idle_pvp_statistic_rl_bt   rl_bts      = 4; // 各个段位的战斗次数\轮次
}

message idle_pvp_statistic {
  optional uint64 id          = 1; // 数据id = TID * 1000 + rankLevel * 100 + rankSect * 10 + quality
  optional uint64 bt_cnt      = 2; // 上场次数
  optional uint64 win_cnt     = 3; // 胜利次数
}

message idle_pvp_statistic_rl_bt {
  optional uint64 rank_level  = 1;
  optional uint64 bt_cnt      = 2;
}

message idle_pvp_newbie {
  required t_idle_pvp_hunter_type hunter_type   = 1; // 玩家类型：新手or正常
  required uint64                 highest_score = 2; // 历史达到的最高分,可用于判断是否可跳过新手赛区
}

