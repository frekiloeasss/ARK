    optional infinite_revert_floor  revert_floor            = 15; // 记录回溯整层需要的信息
    optional infinite_revert_floor  before_battle_revert_floor = 16; // 记录回溯单场战斗需要的信息
    optional infinite_pan_opts      infinite_pan_opts       = 17;
