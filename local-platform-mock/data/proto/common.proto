message stage {
  required uint32         cur_stage            = 1 [default = 1];
  required idle           idle                 = 2;
  required cd             battle_cd            = 3[deprecated=true];
  required cd             quick_idle_cd        = 4; //快速挂机购买cd
  required bool           chapter_over         = 5 [default = false]; //是否需要跳转到世界地图
  repeated special_loot   special_loots        = 6;
  optional uint64         defeat_cnt           = 7[deprecated=true];
  optional int32          last_weight          = 8[deprecated=true];
