message dragon_stela {
  required int64          lv                = 1[default = 0];  // 石碑等级
  map<uint64, uint64>     recvd_energy_his  = 2;  // 能量汲取历史记录 {hero_tid, quality}
  repeated int64          engrave_his       = 3;  // 铭刻历史记录
}

message hero_return_data {
  optional    uint64            uid             = 1;
  map<uint64, uint64>           hero_quality    = 2; // 继承的英雄品阶 hero_tid -> quality
}

message acc_summary {
  optional acc_user_summary            user                   = 1; //玩家关卡进度最高的角色
  optional uint64                      svr_id                 = 2; //最后一次登录的服务器ID
  optional uint64                      last_login_ts          = 3; //最后一次登录时间
  optional string                      region                 = 4; //大区需要用字符串 组队服/经典服的 t_region定义不相同
}

// 因为跨服务器查询玩家信息 两边的user_summary保存的各类配置表ID无法对上 因此专门新增一个跨服查询玩家信息
message acc_user_summary {
  required uint64                      uid                    = 1;
  optional uint32                      svr_id                 = 2;
  optional string                      name                   = 3;
  optional uint32                      level                  = 4;
  optional string                      avatar                 = 6;
  optional string                      stage                  = 7; //这里是读取配置表关卡对应的显示文本
}