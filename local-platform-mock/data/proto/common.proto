  required uint64                 season                  = 8; // 当前赛季 补发奖励时用于确认具体配置
  optional uint64                 expire_ts               = 9; // 什么时候进行结算 undefined表示已经结算过 不用处理
  repeated infinite_boss_his_record his_records           = 10; // 历史战斗记录
