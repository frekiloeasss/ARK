  optional hero_cosplay_enemy  cur_battle_enemy      = 3; //当前敌人
  required uint64              battle_use_ts         = 4[default=0]; //总战斗用时 秒
  required uint64              defeated_cnt          = 5[default=0]; //失败次数
  repeated uint64              victory_hero_tids     = 6; //胜利过的sp英雄的tid列表（用于最终结算展示）
