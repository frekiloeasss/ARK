  repeated act_cook_food    cook_foods           = 3;                // 烹饪的食物数据
  required uint64           lv                   = 4[default = 1];   // 烹饪等级
  required uint64           exp                  = 5[default = 0];   // 经验点数
  required uint64           exp_cook_cnt         = 6;                // 加经验的烹饪次数
}

